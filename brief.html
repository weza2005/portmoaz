<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <title> ABOUT ENG:MOAZ MOSTAFA.</title>
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white selection:bg-cyan-500">
<div class="mt-8 text-center">
                <a href="index.html" class="text-slate-500 hover:text-white text-sm transition-colors">← العودة للرئيسية</a>
            </div>
    <div class="min-h-screen flex items-center justify-center px-6 py-12 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-cyan-500/10 blur-[120px] rounded-full"></div>

        <div class="max-w-2xl w-full bg-slate-900/50 backdrop-blur-xl border border-white/5 p-10 rounded-[3rem] shadow-2xl relative z-10">
            
            <header class="text-center mb-10">
                <h1 class="text-3xl font-bold mb-2">تخطيط <span class="text-cyan-400">مشروعك</span></h1>
                <p class="text-slate-400">جاوب على الأسئلة دي عشان نبدأ نبني حاجة عظيمة سوا.</p>
            </header>

            <form action="#" class="space-y-8">
                <div class="space-y-3">
                    <label class="text-cyan-400 font-bold text-sm uppercase tracking-widest block">01. فكرة المشروع</label>
                    <p class="text-slate-500 text-sm italic">ايه هي الفكرة الأساسية للموقع؟ (مثلاً: متجر ملابس، منصة تعليمية..)</p>
                    <textarea rows="3" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-4 outline-none focus:border-cyan-500 transition-all text-white placeholder:text-slate-600" placeholder="اشرح فكرتك هنا..."></textarea>
                </div>

                <div class="space-y-3">
                    <label class="text-cyan-400 font-bold text-sm uppercase tracking-widest block">02. الجمهور المستهدف</label>
                    <p class="text-slate-500 text-sm italic">مين الناس اللي هيستخدموا الموقع ده؟</p>
                    <input type="text" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-4 outline-none focus:border-cyan-500 transition-all" placeholder="مثال: شباب مهتمين بالموضة">
                </div>

                <div class="space-y-3">
                    <label class="text-cyan-400 font-bold text-sm uppercase tracking-widest block">03.طريقت الدفع</label>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <label class="flex items-center gap-3 p-3 bg-slate-800/30 border border-slate-700 rounded-xl cursor-pointer hover:bg-cyan-500/10 transition-all">
                            <input type="checkbox" class="accent-cyan-500"> نظام دفع أونلاين
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-slate-800/30 border border-slate-700 rounded-xl cursor-pointer hover:bg-cyan-500/10 transition-all">
                            <input type="checkbox" class="accent-cyan-500"> لوحة تحكم (Dashboard)
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-slate-800/30 border border-slate-700 rounded-xl cursor-pointer hover:bg-cyan-500/10 transition-all">
                            <input type="checkbox" class="accent-cyan-500"> تعدد لغات (Ar/En)
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-slate-800/30 border border-slate-700 rounded-xl cursor-pointer hover:bg-cyan-500/10 transition-all">
                            <input type="checkbox" class="accent-cyan-500"> نظام عضوية للطلاب
                        </label>
                    </div>
                </div>

            
            </form>

            
        </div<form id="brief-form" class="space-y-8">
    <div class="space-y-3">
        <label class="text-cyan-400 font-bold text-sm uppercase tracking-widest block underline decoration-cyan-500/30 underline-offset-8">04. فكرة المشروع</label>
        <textarea id="project-idea" rows="3" required
                  class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-4 outline-none focus:border-cyan-500 transition-all text-white placeholder:text-slate-600" 
                  placeholder="اشرح فكرتك هنا..."></textarea>
    </div>

    <div class="space-y-3">
        <label class="text-cyan-400 font-bold text-sm uppercase tracking-widest block underline decoration-cyan-500/30 underline-offset-8">05. الجمهور المستهدف</label>
        <input id="target-audience" type="text" required
               class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-4 outline-none focus:border-cyan-500 transition-all" 
               placeholder="مثال: شباب مهتمين بالموضة">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
            <label class="text-xs text-slate-400 mr-2 uppercase">الميزانية التقريبية</label>
            <input id="budget" type="text" placeholder="مثلاً: 5000 ج.م" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-4 outline-none focus:border-cyan-500">
        </div>
        <div class="space-y-2">
            <label class="text-xs text-slate-400 mr-2 uppercase">وقت التسليم المطلوب</label>
            <input id="timeline" type="text" placeholder="مثلاً: أسبوعين" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-4 outline-none focus:border-cyan-500">
        </div>
    </div>

    <button type="button" onclick="sendToWhatsApp()" 
            class="group relative w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-5 rounded-2xl shadow-lg shadow-cyan-900/20 transition-all transform hover:-translate-y-1 overflow-hidden">
        <span class="relative z-10 flex items-center justify-center gap-3 italic">
            إرسال مواصفات المشروع لمعاذ 🚀
        </span>
    </button>
</form>

<script>
function sendToWhatsApp() {
    // سحب البيانات من الحقول
    const idea = document.getElementById('project-idea').value;
    const target = document.getElementById('target-audience').value;
    const budget = document.getElementById('budget').value || "غير محدد";
    const timeline = document.getElementById('timeline').value || "غير محدد";

    if(!idea || !target) {
        alert("يا هندسة، لازم تملا الفكرة والجمهور المستهدف الأول! 😉");
        return;
    }

    // تجهيز نص الرسالة بشكل شيك
    const message = `*طلب مشروع جديد من البورتفوليو* 📑%0A%0A` +
                    `*1. فكرة المشروع:* %0A${idea}%0A%0A` +
                    `*2. الجمهور المستهدف:* %0A${target}%0A%0A` +
                    `*3. الميزانية:* ${budget}%0A` +
                    `*4. وقت التسليم:* ${timeline}%0A%0A` +
                    `_تم الإرسال عبر Brief Planner_`;

    // رقم واتساب معاذ
    const phoneNumber = "201095329616";
    
    // فتح الواتساب
    window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
}
</script>
        
    </div>

</body>
</html>

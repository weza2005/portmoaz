// Ripple effect hook
function useRipple() {
  const [ripples, setRipples] = useState([]);
  const trigger = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const id = Date.now();
    setRipples((r) => [...r, { x, y, id }]);
    setTimeout(() => setRipples((r) => r.filter((rp) => rp.id !== id)), 600);
  };
  const RippleContainer = () => (
    <>
      {ripples.map((rp) => (
        <span key={rp.id} style={{
          position: "absolute", left: rp.x, top: rp.y,
          width: 6, height: 6, borderRadius: "50%",
          background: "rgba(255,255,255,0.55)",
          transform: "translate(-50%,-50%) scale(0)",
          animation: "rippleAnim 0.6s ease-out forwards",
          pointerEvents: "none",
        }} />
      ))}
    </>
  );
  return { trigger, RippleContainer };
}

// Animated "Add" button with checkmark flash
function AddButton({ onClick }) {
  const [state, setState] = useState("idle"); // idle | added
  const { trigger, RippleContainer } = useRipple();

  const handleClick = (e) => {
    e.stopPropagation();
    trigger(e);
    setState("added");
    onClick();
    setTimeout(() => setState("idle"), 900);
  };

  return (
    <button
      onClick={handleClick}
      style={{
        marginTop: 10, border: "none", borderRadius: 30,
        padding: "7px 16px", fontSize: 12, cursor: "pointer",
        fontFamily: "inherit", fontWeight: 700, alignSelf: "flex-end",
        position: "relative", overflow: "hidden",
        background: state === "added" ? "#2e7d32" : "#3d1c0a",
        color: "#fdf8f2",
        transform: state === "added" ? "scale(0.93)" : "scale(1)",
        transition: "background 0.25s, transform 0.15s",
        minWidth: 64,
      }}
    >
      <RippleContainer />
      <span style={{
        display: "inline-block",
        transition: "opacity 0.15s, transform 0.15s",
        opacity: state === "added" ? 0 : 1,
        transform: state === "added" ? "translateY(-8px)" : "translateY(0)",
        position: state === "added" ? "absolute" : "relative",
      }}>+ Add</span>
      <span style={{
        display: "inline-block",
        transition: "opacity 0.15s, transform 0.15s",
        opacity: state === "added" ? 1 : 0,
        transform: state === "added" ? "translateY(0)" : "translateY(8px)",
        position: state === "added" ? "relative" : "absolute",
      }}>✓ Added</span>
    </button>
  );
}

// Generic ripple button
function RippleButton({ onClick, style, children, className, disabled }) {
  const { trigger, RippleContainer } = useRipple();
  const [pressed, setPressed] = useState(false);

  const handleClick = (e) => {
    if (disabled) return;
    trigger(e);
    setPressed(true);
    setTimeout(() => setPressed(false), 150);
    onClick && onClick(e);
  };

  return (
    <button
      disabled={disabled}
      onClick={handleClick}
      className={className}
      style={{
        ...style,
        position: "relative",
        overflow: "hidden",
        transform: pressed ? "scale(0.96)" : "scale(1)",
        transition: (style?.transition || "") + ", transform 0.12s",
      }}
    >
      <RippleContainer />
      {children}
    </button>
  );
}

// Qty stepper with bounce animation
function QtyBtn({ onClick, children }) {
  const [bounce, setBounce] = useState(false);
  const handle = (e) => {
    e.stopPropagation();
    setBounce(true);
    setTimeout(() => setBounce(false), 300);
    onClick(e);
  };
  return (
    <button onClick={handle} style={{
      width: 28, height: 28, borderRadius: "50%",
      border: "1.5px solid #c9a880", background: "none", cursor: "pointer",
      fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center",
      transform: bounce ? "scale(1.35)" : "scale(1)",
      transition: "transform 0.2s cubic-bezier(0.34,1.56,0.64,1), background 0.15s",
    }}>{children}</button>
  );
}

      const key = `${category}-${item.name}`;
      const existing = prev.find((c) => c.key === key);
      if (existing) return prev.map((c) => c.key === key ? { ...c, qty: c.qty + 1 } : c);
      return [...prev, { ...item, category, key, qty: 1 }];

    setCartBump(true);

              <span key={totalQty} style={{
                background: "#f5c88a", color: "#2a0e03", borderRadius: "50%",
                width: 20, height: 20, display: "inline-flex", alignItems: "center",
                justifyContent: "center", fontSize: 12, fontWeight: 700,
                animation: "badgePop 0.35s cubic-bezier(0.34,1.56,0.64,1)",
              }}>{totalQty}</span>
            )}
          </RippleButton>
        )}
      </nav>

      {/* HOME */}
      {page === "home" && (
        <>
          <section className="hero-section" style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center", padding: "96px 24px 60px", backgroundColor: "#e8e0d8", backgroundImage: `url(${TEXTURE_IMG})`, backgroundRepeat: "repeat", backgroundSize: "400px 400px" }}>
            <img src={LOGO_IMG} alt="Brew House" style={{ width: 280, height: 240, marginBottom: 8, objectFit: "contain", animation: "heroFadeIn 0.6s 0.1s ease both", opacity: 0 }} />
            <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "#3d1c0a", color: "#fdf8f2", borderRadius: 40, padding: "6px 16px", fontSize: 13, marginBottom: 40, fontFamily: "'Helvetica Neue',sans-serif", animation: "heroFadeIn 0.6s 0.2s ease both", opacity: 0 }}>
              ⭐ 4.9 · 94 Reviews · Open 24 hours
            </div>
            <h1 style={{ fontSize: "clamp(52px,10vw,110px)", fontWeight: 700, fontStyle: "italic", lineHeight: 0.95, color: "#3d1c0a", marginBottom: 8, letterSpacing: "-0.02em", animation: "heroFadeIn 0.6s 0.3s ease both", opacity: 0 }}>
              Brew House
            </h1>
            <p style={{ fontSize: "clamp(18px,3vw,26px)", color: "#7a4428", marginBottom: 32, fontWeight: 400, fontStyle: "italic", animation: "heroFadeIn 0.6s 0.4s ease both", opacity: 0 }}>
              Specialty Coffee & More in Sheraton, Cairo
            </p>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", justifyContent: "center", animation: "heroFadeIn 0.6s 0.5s ease both", opacity: 0 }}>
              <RippleButton className="primary-btn" onClick={() => setPage("menu")} style={{ background: "#3d1c0a", color: "#fdf8f2", border: "none", borderRadius: 50, padding: "14px 36px", fontSize: 16, cursor: "pointer", fontFamily: "inherit", fontWeight: 600, letterSpacing: "0.04em" }}>
                Browse Menu
              </RippleButton>
              <RippleButton className="secondary-btn" onClick={() => setPage("orders")} style={{ background: "transparent", color: "#3d1c0a", border: "2px solid #3d1c0a", borderRadius: 50, padding: "14px 36px", fontSize: 16, cursor: "pointer", fontFamily: "inherit", fontWeight: 600, letterSpacing: "0.04em" }}>
                Track Order
              </RippleButton>
            </div>
            <div style={{ marginTop: 60, display: "flex", flexWrap: "wrap", gap: 20, justifyContent: "center" }}>
              {[["☕","Specialty Coffee"],["🥐","Fresh Bakeries"],["🍳","All-Day Brunch"],["🍰","Handmade Desserts"]].map(([icon, label], i) => (
                <div key={label} className="hero-card" style={{ background: "rgba(255,253,250,0.88)", borderRadius: 16, padding: "20px 24px", border: "1px solid #e8d5c0", textAlign: "center", minWidth: 120, animation: `heroFadeIn 0.5s ${0.6 + i * 0.1}s ease both`, opacity: 0 }}>
                  <div style={{ fontSize: 32, marginBottom: 6 }}>{icon}</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#7a4428", fontFamily: "'Helvetica Neue',sans-serif" }}>{label}</div>
                </div>
              ))}
            </div>
          </section>
          <div style={{ display: "flex", gap: 24, justifyContent: "center", flexWrap: "wrap", padding: "20px 24px", background: "#3d1c0a", color: "#fdf8f2" }}>
            {[["📍","1 Sayed Zakaria, Sheraton Al Matar, El Nozha, Cairo"],["🕐","Open 24 Hours"],["📞","012 76198176"],["💰","All prices inclusive of taxes"]].map(([icon, text]) => (
              <div key={text} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, fontFamily: "'Helvetica Neue',sans-serif" }}>{icon} {text}</div>
            ))}
          </div>
        </>
      )}

      {/* MENU */}
      {page === "menu" && (
        <div style={{ paddingTop: 56, display: "flex", height: "100vh", overflow: "hidden" }}>
          <aside style={{ width: sidebarOpen ? 200 : 46, background: "#2a0e03", overflowY: sidebarOpen ? "auto" : "hidden", flexShrink: 0, padding: "16px 0", transition: "width 0.25s cubic-bezier(0.4,0,0.2,1)" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: sidebarOpen ? "space-between" : "center", padding: sidebarOpen ? "4px 12px 16px" : "4px 0 16px" }}>
              {sidebarOpen && <span style={{ color: "#f5c88a", fontSize: 11, fontFamily: "\'Helvetica Neue\',sans-serif", letterSpacing: "0.1em", textTransform: "uppercase" }}>Categories</span>}
              <button onClick={() => setSidebarOpen(o => !o)} style={{ background: "rgba(255,200,100,0.15)", border: "1px solid rgba(245,200,138,0.3)", borderRadius: 6, cursor: "pointer", color: "#f5c88a", fontSize: 14, width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                {sidebarOpen ? "\u25C0" : "\u25B6"}
              </button>
            </div>
            {Object.keys(MENU).map((cat) => {
              const active = activeCategory === cat;
              return (
                <div key={cat} className="sidebar-item" onClick={() => scrollToCategory(cat)} title={cat} style={{ display: "flex", alignItems: "center", gap: 8, padding: sidebarOpen ? "10px 16px" : "10px 0", justifyContent: sidebarOpen ? "flex-start" : "center", cursor: "pointer", color: active ? "#f5c88a" : "#c9a880", background: active ? "rgba(255,200,100,0.1)" : "transparent", borderLeft: active ? "3px solid #f5c88a" : "3px solid transparent", fontSize: 13, fontFamily: "\'Helvetica Neue\',sans-serif", whiteSpace: "nowrap", overflow: "hidden" }}>
                  <span style={{ flexShrink: 0, fontSize: 16 }}>{CATEGORY_ICONS[cat]}</span>
                  {sidebarOpen && <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{cat}</span>}
                </div>
              );
            })}
          </aside>
          <main ref={menuRef} style={{ flex: 1, overflowY: "auto", padding: "24px" }} onScroll={(e) => {
            const scrollTop = e.target.scrollTop;
            let current = Object.keys(MENU)[0];
            for (const cat of Object.keys(MENU)) {
              const el = categoryRefs.current[cat];
              if (el && el.offsetTop - 180 <= scrollTop) current = cat;
            }
            setActiveCategory(current);
          }}>
            {!customerName && (
              <div style={{ background: "#fff8e1", border: "1.5px solid #f5c88a", borderRadius: 14, padding: "14px 20px", marginBottom: 24, display: "flex", alignItems: "stretch", gap: 12, flexWrap: "wrap", animation: "fadeIn 0.4s ease" }}>
                <span style={{ fontFamily: "'Helvetica Neue',sans-serif", fontSize: 14, color: "#7a4428" }}>👤 Enter your name to start ordering:</span>
                <input value={nameInput} onChange={(e) => setNameInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && nameInput.trim() && setCustomerName(nameInput.trim())} placeholder="Your name..." style={{ flex: 1, minWidth: 0, width: "100%", padding: "10px 16px", border: "1.5px solid #c9a880", borderRadius: 30, fontSize: 15, fontFamily: "inherit", background: "#fff", color: "#2a0e03", outline: "none", boxSizing: "border-box" }} />
                <RippleButton onClick={() => { if (nameInput.trim()) setCustomerName(nameInput.trim()); }} style={{ background: "#3d1c0a", color: "#fdf8f2", border: "none", borderRadius: 30, padding: "10px 20px", fontSize: 14, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>Confirm</RippleButton>
              </div>
            )}
            {customerName && (
              <div style={{ background: "#e8f5e9", borderRadius: 14, padding: "10px 20px", marginBottom: 24, fontSize: 14, fontFamily: "'Helvetica Neue',sans-serif", color: "#2e7d32", animation: "fadeIn 0.35s ease" }}>
                ✅ Welcome, <strong>{customerName}</strong>! Tap any item to add it to your cart.
              </div>
            )}
            {Object.entries(MENU).map(([cat, items]) => (
              <div key={cat} style={{ marginBottom: 40 }} ref={(el) => (categoryRefs.current[cat] = el)}>
                <h2 style={{ fontSize: 28, fontWeight: 700, fontStyle: "italic", color: "#3d1c0a", marginBottom: 16, paddingBottom: 8, borderBottom: "2px solid #e8d5c0", display: "flex", alignItems: "center", gap: 10 }}>
                  {CATEGORY_ICONS[cat]} {cat}
                </h2>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(200px,1fr))", gap: 12 }}>
                  {items.map((item) => (
                    <div key={item.name} className="item-card" onClick={() => { if (!customerName) { alert("Please enter your name first!"); return; } addToCart(item, cat); }} style={{ background: "#fff", borderRadius: 14, padding: "16px", border: "1px solid #ecddc8", cursor: "pointer", display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
                      <div>
                        <div style={{ fontSize: 15, fontWeight: 600, color: "#2a0e03", marginBottom: 6, fontFamily: "'Helvetica Neue',sans-serif" }}>{item.name}</div>
                        <div style={{ fontSize: 17, fontWeight: 700, color: "#7a4428" }}>E£{item.price}</div>
                      </div>
                      <AddButton onClick={() => { if (!customerName) { alert("Please enter your name first!"); return; } addToCart(item, cat); }} />
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </main>
        </div>
      )}

      {/* ORDERS PAGE */}
      {page === "orders" && (
        <div style={{ maxWidth: 700, margin: "0 auto", padding: "96px 24px 60px" }}>
          <h1 style={{ fontSize: 42, fontStyle: "italic", fontWeight: 700, color: "#3d1c0a", marginBottom: 8, animation: "fadeIn 0.4s ease" }}>My Orders</h1>
          <p style={{ color: "#7a4428", marginBottom: 32, fontFamily: "'Helvetica Neue',sans-serif", animation: "fadeIn 0.4s 0.1s ease both", opacity: 0 }}>Track the status of your orders below</p>
          {orders.length === 0 ? (
            <div style={{ textAlign: "center", padding: "60px 24px", color: "#c9a880", animation: "fadeIn 0.5s ease" }}>
              <div style={{ fontSize: 64, marginBottom: 16 }}>☕</div>
              <div style={{ fontSize: 20, fontStyle: "italic" }}>No orders yet</div>
              <RippleButton className="primary-btn" onClick={() => setPage("menu")} style={{ background: "#3d1c0a", color: "#fdf8f2", border: "none", borderRadius: 50, padding: "14px 36px", fontSize: 16, cursor: "pointer", fontFamily: "inherit", fontWeight: 600, marginTop: 20 }}>
                Order Now
              </RippleButton>
            </div>
          ) : (
            orders.map((order, i) => (
              <div key={order.id} className="order-card" style={{ background: "#fff", borderRadius: 16, padding: "20px 24px", border: "1px solid #e8d5c0", marginBottom: 16, animationDelay: `${i * 0.07}s` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 18, color: "#3d1c0a" }}>{order.name}</div>
                    <div style={{ fontSize: 13, color: "#c9a880", fontFamily: "'Helvetica Neue',sans-serif" }}>{order.id} · {order.time}</div>
                  </div>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 6, background: order.status === "preparing" ? "#e8f5e9" : "#fff8e1", color: order.status === "preparing" ? "#2e7d32" : "#f57f17", borderRadius: 20, padding: "4px 12px", fontSize: 13, fontFamily: "'Helvetica Neue',sans-serif", fontWeight: 600, transition: "all 0.5s" }}>
                    {order.status === "preparing" ? "🍳 Being Prepared" : "⏳ Order Received"}
                  </span>
                </div>
                <div style={{ borderTop: "1px solid #f0e4d4", paddingTop: 12 }}>
                  {order.items.map((item) => (
                    <div key={item.key} style={{ display: "flex", justifyContent: "space-between", fontSize: 14, fontFamily: "'Helvetica Neue',sans-serif", color: "#5a2d14", padding: "4px 0" }}>
                      <span>{item.name} ×{item.qty}</span><span>E£{item.price * item.qty}</span>
                    </div>
                  ))}
                  <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, fontSize: 16, marginTop: 10, paddingTop: 10, borderTop: "1px solid #f0e4d4", color: "#3d1c0a" }}>
                    <span>Total</span><span>E£{order.total}</span>
                  </div>
                </div>
                {order.status === "received" && (
                  <div style={{ marginTop: 12, fontSize: 13, color: "#7a4428", fontFamily: "'Helvetica Neue',sans-serif", background: "#fff8e1", borderRadius: 8, padding: "8px 12px" }}>
                    ⏰ You'll be notified when your order starts being prepared
                  </div>
                )}
              </div>
            ))
          )}
        </div>
      )}

      {/* CART DRAWER */}
      {cartOpen && (
        <>
          <div onClick={() => setCartOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(42,14,3,0.3)", zIndex: 150, animation: "fadeIn 0.2s ease" }} />
          <div style={{ position: "fixed", top: 0, right: 0, bottom: 0, width: 380, background: "#fdf8f2", zIndex: 200, boxShadow: "-8px 0 40px rgba(42,14,3,0.15)", display: "flex", flexDirection: "column", animation: "drawerIn 0.32s cubic-bezier(0.22,1,0.36,1)" }}>
            <div style={{ padding: "20px 24px", borderBottom: "1px solid #e8d5c0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: 24, fontWeight: 700, fontStyle: "italic", color: "#3d1c0a" }}>Your Cart</div>
              <button className="close-btn" onClick={() => setCartOpen(false)} style={{ background: "none", border: "none", fontSize: 26, cursor: "pointer", color: "#3d1c0a", lineHeight: 1 }}>×</button>
            </div>
            <div style={{ flex: 1, overflowY: "auto", padding: "16px 24px" }}>
              {cart.length === 0 ? (
                <div style={{ textAlign: "center", padding: 40, color: "#c9a880" }}>
                  <div style={{ fontSize: 48, marginBottom: 12 }}>🛒</div>
                  <div>Your cart is empty</div>
                </div>
              ) : (
                cart.map((item) => (
                  <div key={item.key} className="cart-item" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 6px", borderBottom: "1px solid #f0e4d4", borderRadius: 8 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 600, fontSize: 15, fontFamily: "'Helvetica Neue',sans-serif" }}>{item.name}</div>
                      <div style={{ color: "#7a4428", fontSize: 14 }}>E£{item.price} each</div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <QtyBtn onClick={() => updateQty(item.key, -1)}>−</QtyBtn>
                      <span style={{ fontFamily: "'Helvetica Neue',sans-serif", fontWeight: 700, minWidth: 16, textAlign: "center" }}>{item.qty}</span>
                      <QtyBtn onClick={() => updateQty(item.key, 1)}>+</QtyBtn>
                      <span style={{ fontWeight: 700, minWidth: 54, textAlign: "right", fontSize: 14 }}>E£{item.price * item.qty}</span>
                      <button className="delete-btn" onClick={() => removeFromCart(item.key)} style={{ background: "none", border: "none", cursor: "pointer", color: "#c9a880", fontSize: 18 }}>🗑</button>
                    </div>
                  </div>
                ))
              )}
            </div>
            <div style={{ padding: "20px 24px", borderTop: "1px solid #e8d5c0" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, fontSize: 18, marginBottom: 16, color: "#3d1c0a" }}>
                <span>Total</span><span>E£{total}</span>
              </div>
              <div style={{ marginBottom: 8, fontSize: 13, fontFamily: "'Helvetica Neue',sans-serif", color: "#7a4428" }}>Customer Name</div>
              <input value={customerName || nameInput} onChange={(e) => { if (!customerName) setNameInput(e.target.value); }} placeholder="Enter your name..." readOnly={!!customerName} style={{ width: "100%", padding: "10px 16px", border: "1.5px solid #c9a880", borderRadius: 30, fontSize: 15, fontFamily: "inherit", background: "#fff", color: "#2a0e03", marginBottom: 12, outline: "none" }} />
              <RippleButton
                className="place-order-btn"
                disabled={(!customerName && !nameInput.trim()) || cart.length === 0}
                onClick={() => { const name = customerName || nameInput.trim(); if (!name) return; if (!customerName) setCustomerName(name); placeOrder(); }}
                style={{ width: "100%", background: "#3d1c0a", color: "#fdf8f2", border: "none", borderRadius: 40, padding: "14px", fontSize: 16, cursor: "pointer", fontFamily: "inherit", fontWeight: 700, letterSpacing: "0.04em", opacity: (!customerName && !nameInput.trim()) || cart.length === 0 ? 0.5 : 1 }}
              >
                Place Order →
              </RippleButton>
            </div>
          </div>
        </>
      )}

      {/* ORDER SUCCESS MODAL */}
      {orderPlaced && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(42,14,3,0.45)", zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center", animation: "fadeIn 0.2s ease" }} onClick={() => { setOrderPlaced(false); setPage("orders"); }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fdf8f2", borderRadius: 24, padding: "40px 44px", maxWidth: 400, width: "90%", textAlign: "center", animation: "modalPop 0.45s cubic-bezier(0.34,1.56,0.64,1)" }}>
            <div style={{ fontSize: 60, marginBottom: 12, animation: "cartBump 0.5s 0.3s ease both" }}>🎉</div>
            <h2 style={{ fontSize: 28, fontStyle: "italic", color: "#3d1c0a", marginBottom: 8 }}>Order Placed!</h2>
            <p style={{ color: "#7a4428", fontFamily: "'Helvetica Neue',sans-serif", fontSize: 15, lineHeight: 1.6, marginBottom: 24 }}>
              Thank you, <strong>{customerName}</strong>!<br />
              Your order has been received. We'll notify you in ~2 minutes when it's being prepared.
            </p>
            <RippleButton className="primary-btn" onClick={() => { setOrderPlaced(false); setPage("orders"); }} style={{ background: "#3d1c0a", color: "#fdf8f2", border: "none", borderRadius: 40, padding: "14px 32px", fontSize: 16, cursor: "pointer", fontFamily: "inherit", fontWeight: 700, width: "100%" }}>
              Track My Order
            </RippleButton>
          </div>
        </div>
      )}

      {/* NOTIFICATION TOAST */}
      {notification && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: "#3d1c0a", color: "#fdf8f2", padding: "16px 28px", borderRadius: 50, fontSize: 15, fontFamily: "'Helvetica Neue',sans-serif", zIndex: 400, boxShadow: "0 8px 32px rgba(42,14,3,0.35)", animation: "slideUp 0.4s ease", whiteSpace: "nowrap" }}>
          🍳 Hey <strong>{notification.name}</strong>! Order <strong>{notification.orderId}</strong> is being prepared!
        </div>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BrewHouseApp />);
  </script>
</body>
</html>

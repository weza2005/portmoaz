<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brew House - تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brown-dark: #2C1810;
    --brown-mid: #6B3A2A;
    --brown-light: #C4956A;
    --cream: #F5EDD8;
    --cream-light: #FAF6EE;
    --accent: #D4AF37;
    --text-dark: #1a0f08;
    --shadow: rgba(44,24,16,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Cairo', sans-serif;
    background: var(--cream-light);
    min-height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* LEFT SIDE - LOGO */
  .left-panel {
    width: 50%;
    background: var(--brown-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .left-panel::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,149,106,0.15) 0%, transparent 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  .left-panel::after {
    content: '';
    position: absolute;
    bottom: -100px; right: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
    animation: pulse 4s ease-in-out infinite reverse;
  }
  @keyframes pulse {
    0%,100%{transform:scale(1);opacity:0.8}
    50%{transform:scale(1.1);opacity:1}
  }
  .logo-container {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: floatUp 1s ease-out forwards;
    opacity: 0;
  }
  @keyframes floatUp {
    from{transform:translateY(30px);opacity:0}
    to{transform:translateY(0);opacity:1}
  }
  .logo-img {
    width: 280px;
    height: 280px;
    object-fit: contain;
    filter: brightness(0) invert(1) sepia(1) saturate(2) hue-rotate(10deg);
    animation: logoGlow 3s ease-in-out infinite;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border: 2px solid rgba(196,149,106,0.3);
  }
  @keyframes logoGlow {
    0%,100%{filter:brightness(0.9) invert(1) sepia(1) saturate(1.5) hue-rotate(10deg);}
    50%{filter:brightness(1.1) invert(1) sepia(1) saturate(2) hue-rotate(15deg);}
  }
  .brand-name {
    font-family: 'Playfair Display', serif;
    color: var(--cream);
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 4px;
    margin-top: 20px;
    text-shadow: 0 2px 20px rgba(196,149,106,0.5);
  }
  .brand-tagline {
    color: var(--brown-light);
    font-size: 1rem;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-top: 8px;
    font-weight: 300;
  }
  .decorative-line {
    width: 120px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--brown-light), transparent);
    margin: 15px auto;
  }
  .stars-decoration {
    color: var(--accent);
    font-size: 1.2rem;
    letter-spacing: 8px;
    margin-top: 10px;
  }

  /* RIGHT SIDE - FORM */
  .right-panel {
    width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream-light);
    position: relative;
    padding: 40px;
  }
  .right-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C4956A' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }
  .form-box {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    animation: slideIn 0.8s 0.3s ease-out forwards;
    opacity: 0;
  }
  @keyframes slideIn {
    from{transform:translateX(30px);opacity:0}
    to{transform:translateX(0);opacity:1}
  }
  .form-header {
    text-align: center;
    margin-bottom: 35px;
  }
  .form-header h2 {
    font-family: 'Playfair Display', serif;
    color: var(--brown-dark);
    font-size: 2rem;
    font-weight: 700;
  }
  .form-header p {
    color: var(--brown-mid);
    margin-top: 8px;
    font-size: 0.9rem;
  }

  /* TAB SWITCHER */
  .tab-switcher {
    display: flex;
    background: var(--cream);
    border-radius: 50px;
    padding: 5px;
    margin-bottom: 30px;
    border: 1px solid rgba(196,149,106,0.3);
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 50px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    color: var(--brown-mid);
  }
  .tab-btn.active {
    background: var(--brown-dark);
    color: var(--cream);
    box-shadow: 0 4px 15px var(--shadow);
  }

  /* FORM CONTENT */
  .form-section { display: none; }
  .form-section.active { display: block; }

  .input-group {
    margin-bottom: 18px;
    position: relative;
  }
  .input-group label {
    display: block;
    color: var(--brown-dark);
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .input-group input {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid rgba(196,149,106,0.3);
    border-radius: 12px;
    background: white;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    color: var(--text-dark);
    transition: all 0.3s;
    outline: none;
  }
  .input-group input:focus {
    border-color: var(--brown-light);
    box-shadow: 0 0 0 4px rgba(196,149,106,0.1);
    transform: translateY(-1px);
  }
  .input-group .icon {
    position: absolute;
    left: 15px;
    top: 42px;
    color: var(--brown-light);
    font-size: 1rem;
  }
  .input-group input { padding-left: 42px; }

  .submit-btn {
    width: 100%;
    padding: 15px;
    background: var(--brown-dark);
    color: var(--cream);
    border: none;
    border-radius: 12px;
    font-family: 'Cairo', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
    margin-top: 10px;
    position: relative;
    overflow: hidden;
  }
  .submit-btn::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    background: rgba(196,149,106,0.3);
    border-radius: 50%;
    transform: translate(-50%,-50%);
    transition: width 0.6s, height 0.6s;
  }
  .submit-btn:hover::before { width: 400px; height: 400px; }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--shadow); }
  .submit-btn:active { transform: translateY(0); }

  .divider {
    text-align: center;
    margin: 20px 0;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 40%;
    height: 1px;
    background: rgba(196,149,106,0.3);
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }
  .divider span { color: var(--brown-mid); font-size: 0.8rem; background: var(--cream-light); padding: 0 10px; }

  .social-login {
    display: flex;
    gap: 12px;
  }
  .social-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid rgba(196,149,106,0.3);
    border-radius: 12px;
    background: white;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.85rem;
    color: var(--brown-dark);
    font-weight: 600;
  }
  .social-btn:hover { border-color: var(--brown-light); background: var(--cream); transform: translateY(-2px); }

  .forget-link {
    text-align: center;
    margin-top: 15px;
    font-size: 0.85rem;
    color: var(--brown-mid);
  }
  .forget-link a { color: var(--brown-light); text-decoration: none; font-weight: 600; }
  .forget-link a:hover { color: var(--brown-dark); }

  /* ADMIN BADGE */
  .admin-link {
    position: absolute;
    top: 20px;
    left: 20px;
    background: var(--brown-dark);
    color: var(--cream);
    padding: 8px 16px;
    border-radius: 50px;
    font-size: 0.8rem;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .admin-link:hover { background: var(--brown-mid); transform: translateY(-2px); }

  /* Floating coffee beans */
  .floating-bean {
    position: absolute;
    font-size: 1.5rem;
    opacity: 0.08;
    animation: floatBean linear infinite;
  }
  @keyframes floatBean {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.08; }
    90% { opacity: 0.08; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
  }

  /* Toast notification */
  .toast {
    position: fixed;
    top: 30px;
    right: 30px;
    background: var(--brown-dark);
    color: var(--cream);
    padding: 14px 24px;
    border-radius: 12px;
    font-weight: 600;
    transform: translateX(200px);
    opacity: 0;
    transition: all 0.4s;
    z-index: 1000;
    border-left: 4px solid var(--accent);
  }
  .toast.show { transform: translateX(0); opacity: 1; }
</style>
</head>
<body>

<!-- LEFT PANEL -->
<div class="left-panel">
  <!-- Floating beans -->
  <div class="floating-bean" style="left:10%;animation-duration:8s;animation-delay:0s">☕</div>
  <div class="floating-bean" style="left:30%;animation-duration:12s;animation-delay:3s">✦</div>
  <div class="floating-bean" style="left:60%;animation-duration:10s;animation-delay:1s">♪</div>
  <div class="floating-bean" style="left:80%;animation-duration:9s;animation-delay:5s">☕</div>

  <div class="logo-container">
    <!-- Using a generated logo placeholder since the image path may vary -->
    <div style="width:240px;height:240px;border-radius:50%;background:rgba(196,149,106,0.1);border:3px solid rgba(196,149,106,0.4);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;overflow:hidden;">
      <div style="text-align:center;">
        <div style="font-size:4rem;">🎧</div>
        <div style="font-size:1.5rem;margin-top:-10px;">☕</div>
      </div>
      <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 50% 50%,rgba(196,149,106,0.05),transparent);animation:pulse 3s infinite;"></div>
    </div>
    <div class="brand-name">Brew House</div>
    <div class="decorative-line"></div>
    <div class="brand-tagline">هاوس</div>
    <div class="stars-decoration">✦ ✦ ✦</div>
    <div style="color:var(--brown-light);font-size:0.85rem;margin-top:12px;font-style:italic;">A Taste Above.</div>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="right-panel">
  <a href="brewhouse_dashboard.html" class="admin-link">⚙️ لوحة الإدارة</a>

  <div class="form-box">
    <div class="form-header">
      <h2>مرحباً بك! 👋</h2>
      <p>سجّل دخولك أو أنشئ حسابك للبدء</p>
    </div>

    <div class="tab-switcher">
      <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="tab-btn" onclick="switchTab('signup')">حساب جديد</button>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="login-form">
      <div class="input-group">
        <label>رقم الهاتف أو الإيميل</label>
        <span class="icon">📱</span>
        <input type="text" id="login-id" placeholder="01xxxxxxxxx أو email@example.com">
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <span class="icon">🔒</span>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <button class="submit-btn" onclick="handleLogin()">تسجيل الدخول ☕</button>
      <div class="forget-link">
        <a href="#">نسيت كلمة المرور؟</a>
      </div>
      <div class="divider"><span>أو ادخل بـ</span></div>
      <div class="social-login">
        <button class="social-btn" onclick="window.open('https://www.google.com','_blank')">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.29-8.16 2.29-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Google
        </button>
        <button class="social-btn" onclick="window.open('https://www.facebook.com','_blank')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
      </div>
    </div>

    <!-- SIGNUP -->
    <div class="form-section" id="signup-form">
      <div class="input-group">
        <label>الاسم الكامل</label>
        <span class="icon">👤</span>
        <input type="text" id="reg-name" placeholder="اسمك الكامل">
      </div>
      <div class="input-group">
        <label>رقم الهاتف</label>
        <span class="icon">📱</span>
        <input type="tel" id="reg-phone" placeholder="01xxxxxxxxx">
      </div>
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <span class="icon">📧</span>
        <input type="email" id="reg-email" placeholder="email@example.com">
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <span class="icon">🔒</span>
        <input type="password" id="reg-pass" placeholder="••••••••">
      </div>
      <button class="submit-btn" onclick="handleSignup()">إنشاء الحساب 🎉</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ تم بنجاح!</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (tab==='login'&&i===0)||(tab==='signup'&&i===1));
  });
  document.getElementById('login-form').classList.toggle('active', tab==='login');
  document.getElementById('signup-form').classList.toggle('active', tab==='signup');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

function handleLogin() {
  const id = document.getElementById('login-id').value;
  const pass = document.getElementById('login-pass').value;
  if(!id || !pass) { showToast('⚠️ من فضلك ادخل بياناتك'); return; }
  showToast('✅ جاري تسجيل الدخول...');
  setTimeout(()=> window.location.href='brewhouse_customer.html', 1200);
}

function handleSignup() {
  const name = document.getElementById('reg-name').value;
  const phone = document.getElementById('reg-phone').value;
  const email = document.getElementById('reg-email').value;
  const pass = document.getElementById('reg-pass').value;
  if(!name||!phone||!email||!pass){ showToast('⚠️ من فضلك ادخل كل البيانات'); return; }
  if(!/^01[0125]\d{8}$/.test(phone)){ showToast('⚠️ رقم الهاتف غير صحيح'); return; }
  if(!/\S+@\S+\.\S+/.test(email)){ showToast('⚠️ البريد الإلكتروني غير صحيح'); return; }
  showToast('🎉 تم إنشاء الحساب بنجاح!');
  setTimeout(()=> window.location.href='brewhouse_customer.html', 1200);
}
</script>
</body>
</html>

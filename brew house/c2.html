/* ─── HOOKS ─── */
function useRipple(){
  const [ripples,setRipples]=useState([]);
  const fire=(e)=>{
    const r=e.currentTarget.getBoundingClientRect();
    const id=Date.now()+Math.random();
    setRipples(p=>[...p,{x:e.clientX-r.left,y:e.clientY-r.top,id}]);
    setTimeout(()=>setRipples(p=>p.filter(x=>x.id!==id)),700);
  };
  const Ripples=()=>(<>{ripples.map(r=>(
    <span key={r.id} style={{position:"absolute",left:r.x,top:r.y,width:8,height:8,borderRadius:"50%",
      background:"rgba(255,255,255,0.4)",transform:"translate(-50%,-50%) scale(0)",
      animation:"ripple .7s ease-out forwards",pointerEvents:"none"}}/>
  ))}</>);
  return {fire,Ripples};
}

/* ─── COMPONENTS ─── */
function Btn({children,onClick,style={},disabled}){
  const {fire,Ripples}=useRipple();
  const [down,setDown]=useState(false);
  return(
    <button disabled={disabled} onMouseDown={()=>setDown(true)} onMouseUp={()=>setDown(false)}
      onMouseLeave={()=>setDown(false)}
      onClick={(e)=>{fire(e);onClick&&onClick(e);}}
      style={{border:"none",cursor:disabled?"not-allowed":"pointer",position:"relative",overflow:"hidden",
        fontFamily:"'DM Sans',sans-serif",transform:down?"scale(0.96)":"scale(1)",
        transition:"transform .12s,opacity .15s",opacity:disabled?.45:1,...style}}>
      <Ripples/>{children}
    </button>
  );
}

function AddBtn({onClick}){
  const [done,setDone]=useState(false);
  const {fire,Ripples}=useRipple();
  const handle=(e)=>{
    e.stopPropagation();fire(e);setDone(true);onClick();
    setTimeout(()=>setDone(false),1000);
  };
  return(
    <button onClick={handle} style={{
      border:"none",borderRadius:40,padding:"7px 18px",fontSize:12,cursor:"pointer",
      fontFamily:"'DM Sans',sans-serif",fontWeight:600,position:"relative",overflow:"hidden",
      background:done?"#1e5c2e":"#3d1c0a",color:done?"#e8f5e9":"#faf6f0",
      transform:done?"scale(0.94)":"scale(1)",transition:"all .2s",minWidth:72,alignSelf:"flex-end",
    }}>
      <Ripples/>
      {done?"✓ Added":"+ Add"}
    </button>
  );
}

}

        {/* Instagram CTA */}
        <div style={{marginTop:36}}>
          <p style={{color:"var(--muted)",fontFamily:"'DM Sans',sans-serif",fontSize:12,marginBottom:12}}>
            📸 Tag us <strong>@brewhousecafe</strong> and get featured on our story!
          </p>
          <Btn onClick={()=>window.open("https://www.instagram.com/","_blank")} style={{
            background:"linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)",color:"#fff",
            borderRadius:40,padding:"10px 28px",fontSize:13,fontWeight:600,
          }}>Open Instagram 📷</Btn>
        </div>
      </div>

      {/* ─── MENU PREVIEW ─── */}
      <div style={{padding:"64px 24px",background:"var(--sand)"}}>
        <div style={{maxWidth:800,margin:"0 auto",textAlign:"center"}}>
          <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,letterSpacing:".2em",textTransform:"uppercase",color:"var(--muted)",marginBottom:8}}>Today's picks</p>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:40,fontStyle:"italic",color:"var(--dark)",marginBottom:36}}>Highlights</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(156px,1fr))",gap:12}}>
            {[{n:"Pistachio Latte",p:190,e:"☕"},{n:"Spanish Matcha",p:200,e:"🍵"},{n:"San Sebastian",p:190,e:"🍰"},
              {n:"Croissant",p:100,e:"🥐"},{n:"Caesar Salad",p:195,e:"🥗"},{n:"Blueberry Milkshake",p:155,e:"🥛"}].map((item,i)=>(
              <div key={i} onClick={()=>setPage("menu")}
                style={{background:"var(--white)",borderRadius:14,padding:"20px 14px",
                  border:"1px solid var(--border)",cursor:"pointer",textAlign:"center",
                  transition:"transform .18s,box-shadow .18s",}}
                onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-4px)";e.currentTarget.style.boxShadow="0 8px 28px rgba(26,12,4,.11)";}}
                onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="";}}>
                <div style={{fontSize:30,marginBottom:8}}>{item.e}</div>
                <div style={{fontSize:13,fontWeight:600,color:"var(--dark)",marginBottom:5,fontFamily:"'DM Sans',sans-serif"}}>{item.n}</div>
                <div style={{fontSize:15,fontWeight:700,color:"var(--brown)"}}>E£{item.p}</div>
                <div style={{fontSize:10,color:"var(--amber)",marginTop:3,fontFamily:"'DM Sans',sans-serif"}}>+{Math.floor(item.p*.1)} pts cashback</div>
              </div>
            ))}
          </div>
          <Btn onClick={()=>setPage("menu")} style={{marginTop:32,background:"var(--dark)",color:"var(--cream)",borderRadius:40,padding:"14px 40px",fontSize:14,fontWeight:600}}>
            View Full Menu →
          </Btn>
        </div>
      </div>

      {/* FOOTER */}
      <footer style={{background:"var(--dark)",color:"rgba(250,246,240,.5)",padding:"32px 24px",textAlign:"center"}}>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,fontStyle:"italic",color:"var(--amber-light)",marginBottom:6}}>Brew House</div>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,marginBottom:14}}>Specialty Coffee &amp; Artisan Food</div>
        <div style={{display:"flex",justifyContent:"center",gap:14,flexWrap:"wrap"}}>
          {SOCIALS.map((s,i)=>(
            <a key={i} href={s.url} target="_blank" rel="noopener noreferrer" style={{color:"rgba(250,246,240,.4)",textDecoration:"none",fontSize:22}}>{s.icon}</a>
          ))}
        </div>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,marginTop:14,color:"rgba(250,246,240,.25)"}}>© 2025 BrewHouse. All rights reserved.</div>
      </footer>
    </div>
  );

  /* ═══════════════ MENU PAGE ═══════════════ */
  /* ═══════════════ ORDERS PAGE ═══════════════ */
  return(
    <div style={{background:"var(--cream)",minHeight:"100vh"}}>
      <Nav/>

      {page==="menu"&&(
        <div style={{display:"flex",paddingTop:62,height:"100vh",overflow:"hidden"}}>
          {/* Sidebar */}
          <aside style={{width:176,flexShrink:0,overflowY:"auto",borderRight:"1px solid var(--border)",
            padding:"12px 0",background:"var(--white)",}}>
            {Object.keys(MENU).map(cat=>(
              <button key={cat} onClick={()=>scrollToCat(cat)} style={{
                display:"flex",alignItems:"center",gap:7,width:"100%",
                padding:"9px 14px",border:"none",background:activeCat===cat?"#f5e8d5":"none",
                cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontSize:12,
                color:activeCat===cat?"var(--brown)":"var(--muted)",
                fontWeight:activeCat===cat?700:400,textAlign:"left",
                borderLeft:activeCat===cat?"3px solid var(--amber)":"3px solid transparent",
                transition:"background .15s",
              }}>
                <span style={{fontSize:14}}>{CAT_ICONS[cat]}</span>
                <span style={{lineHeight:1.2}}>{cat}</span>
              </button>
            ))}
          </aside>

          {/* Menu content */}
          <main ref={menuScroll} style={{flex:1,overflowY:"auto",padding:"20px 24px 80px"}}>
            {/* Points bar */}
            {customer&&(
              <div style={{background:"linear-gradient(135deg,#2a0e03,#4a2010)",borderRadius:12,
                padding:"12px 18px",marginBottom:20,display:"flex",alignItems:"center",justifyContent:"space-between",}}>
                <span style={{color:"rgba(250,246,240,.8)",fontFamily:"'DM Sans',sans-serif",fontSize:13}}>
                  Hi <strong style={{color:"#e8b96a"}}>{customer.name}</strong> 👋 You have
                </span>
                <div style={{background:"linear-gradient(135deg,#c9943a,#e8b96a)",borderRadius:20,padding:"3px 12px",
                  display:"flex",alignItems:"center",gap:5}}>
                  <span style={{fontSize:12}}>⭐</span>
                  <span style={{fontWeight:700,color:"#3d1c0a",fontSize:12,fontFamily:"'DM Sans',sans-serif"}}>{totalPts} pts</span>
                </div>
              </div>
            )}

            {Object.entries(MENU).map(([cat,items])=>(
              <div key={cat} style={{marginBottom:36}} ref={el=>catRefs.current[cat]=el}>
                <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:26,fontWeight:700,fontStyle:"italic",
                  color:"var(--dark)",marginBottom:14,paddingBottom:8,borderBottom:"2px solid var(--border)",
                  display:"flex",alignItems:"center",gap:8}}>
                  {CAT_ICONS[cat]} {cat}
                </h2>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:10}}>
                  {items.map(item=>(
                    <div key={item.name} style={{
                      background:"var(--white)",borderRadius:12,padding:"14px",
                      border:"1px solid var(--border)",display:"flex",flexDirection:"column",
                      justifyContent:"space-between",cursor:"pointer",
                      transition:"transform .18s,box-shadow .18s",
                    }}
                    onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="0 6px 20px rgba(26,12,4,.09)";}}
                    onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="";}}>
                      <div>
                        <div style={{fontSize:14,fontWeight:600,color:"var(--dark)",marginBottom:4,fontFamily:"'DM Sans',sans-serif",lineHeight:1.3}}>{item.name}</div>
                        <div style={{fontSize:16,fontWeight:700,color:"var(--brown)"}}>E£{item.price}</div>
                        <div style={{fontSize:10,color:"var(--amber)",marginTop:3,fontFamily:"'DM Sans',sans-serif"}}>+{Math.floor(item.price*.1)} pts cashback</div>
                      </div>
                      <AddBtn onClick={()=>{
                        if(!customer&&!formData.name.trim()){
                          showToast("Please fill your details in the cart to order","error");
                          setCartOpen(true);return;
                        }
                        addToCart(item,cat);
                        showToast(`${item.name} added to cart ✓`);
                      }}/>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </main>
        </div>
      )}

      {page==="orders"&&(
        <div style={{maxWidth:680,margin:"0 auto",padding:"90px 24px 60px"}}>
          <h1 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:44,fontStyle:"italic",color:"var(--dark)",marginBottom:6,animation:"fadeUp .4s ease"}}>My Orders</h1>
          {customer&&(
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:24}}>
              <span style={{color:"var(--muted)",fontSize:13,fontFamily:"'DM Sans',sans-serif"}}>Rewards balance:</span>
              <div style={{background:"linear-gradient(135deg,#c9943a,#e8b96a)",borderRadius:20,padding:"3px 12px",
                display:"flex",alignItems:"center",gap:5,animation:"ping 2.5s infinite"}}>
                <span style={{fontSize:12}}>⭐</span>
                <span style={{fontWeight:700,color:"#3d1c0a",fontSize:12,fontFamily:"'DM Sans',sans-serif"}}>{totalPts} pts = E£{totalPts}</span>
              </div>
            </div>
          )}
          {orders.length===0?(
            <div style={{textAlign:"center",padding:"64px 24px",color:"var(--muted)",animation:"fadeIn .5s ease"}}>
              <div style={{fontSize:60,marginBottom:14}}>☕</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:24,fontStyle:"italic",marginBottom:6}}>No orders yet</div>
              <div style={{fontSize:13,marginBottom:22,fontFamily:"'DM Sans',sans-serif"}}>Head to the menu and place your first order</div>
              <Btn onClick={()=>setPage("menu")} style={{background:"var(--dark)",color:"var(--cream)",borderRadius:40,padding:"13px 36px",fontSize:14,fontWeight:600}}>Browse Menu</Btn>
            </div>
          ):orders.map((order,i)=>(
            <div key={order.id} style={{
              background:"var(--white)",borderRadius:16,padding:"20px 22px",
              border:"1px solid var(--border)",marginBottom:14,
              animation:"orderIn .4s ease both",animationDelay:`${i*.07}s`,opacity:0,
            }}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <div>
                  <div style={{fontWeight:700,fontSize:17,color:"var(--dark)",fontFamily:"'DM Sans',sans-serif"}}>{order.name}</div>
                  <div style={{fontSize:12,color:"var(--muted)",fontFamily:"'DM Sans',sans-serif",marginTop:2}}>{order.id} · {order.time}</div>
                </div>
                <span style={{
                  display:"inline-flex",alignItems:"center",gap:5,
                  background:order.status==="preparing"?"#e8f5e9":"#fff8e1",
                  color:order.status==="preparing"?"#2e7d32":"#f57f17",
                  borderRadius:20,padding:"4px 12px",fontSize:12,fontFamily:"'DM Sans',sans-serif",fontWeight:600,
                }}>{order.status==="preparing"?"🍳 Being Prepared":"⏳ Received"}</span>
              </div>
              <div style={{borderTop:"1px solid var(--border)",paddingTop:10}}>
                {order.items.map(item=>(
                  <div key={item.key} style={{display:"flex",justifyContent:"space-between",fontSize:13,
                    fontFamily:"'DM Sans',sans-serif",color:"var(--muted)",padding:"3px 0"}}>
                    <span>{item.name} ×{item.qty}</span><span style={{color:"var(--dark)",fontWeight:600}}>E£{item.price*item.qty}</span>
                  </div>
                ))}
                <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:16,
                  marginTop:10,paddingTop:10,borderTop:"1px solid var(--border)",color:"var(--dark)"}}>
                  <span>Total</span><span>E£{order.total}</span>
                </div>
                <div style={{marginTop:8,background:"#fffbeb",borderRadius:8,padding:"6px 10px",
                  display:"flex",alignItems:"center",gap:6,fontSize:12,fontFamily:"'DM Sans',sans-serif",color:"#7a4428"}}>
                  ⭐ Earned <strong>{order.pts} reward points</strong> on this order
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ─── CART DRAWER ─── */}
      {cartOpen&&(
        <>
          <div onClick={()=>setCartOpen(false)} style={{position:"fixed",inset:0,background:"rgba(26,12,4,.35)",zIndex:300,animation:"fadeIn .2s ease"}}/>
          <div style={{
            position:"fixed",top:0,right:0,bottom:0,width:420,maxWidth:"95vw",background:"var(--white)",zIndex:400,
            boxShadow:"-10px 0 50px rgba(26,12,4,.16)",display:"flex",flexDirection:"column",
            animation:"slideRight .32s cubic-bezier(.22,1,.36,1)",
          }}>
            <div style={{padding:"18px 22px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:24,fontStyle:"italic",color:"var(--dark)",fontWeight:700}}>Your Cart</span>
              <Btn onClick={()=>setCartOpen(false)} style={{fontSize:24,color:"var(--dark)",background:"none",padding:"2px 6px"}}>×</Btn>
            </div>

            <div style={{flex:1,overflowY:"auto",padding:"14px 22px"}}>
              {cart.length===0?(
                <div style={{textAlign:"center",padding:"48px 0",color:"var(--muted)"}}>
                  <div style={{fontSize:48,marginBottom:10}}>🛒</div>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14}}>Your cart is empty</div>
                </div>
              ):cart.map(item=>(
                <div key={item.key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                  padding:"11px 0",borderBottom:"1px solid var(--border)"}}>
                  <div style={{flex:1,marginRight:10}}>
                    <div style={{fontWeight:600,fontSize:14,fontFamily:"'DM Sans',sans-serif",color:"var(--dark)"}}>{item.name}</div>
                    <div style={{color:"var(--muted)",fontSize:13}}>E£{item.price}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:7}}>
                    <QtyBtn onClick={()=>changeQty(item.key,-1)}>−</QtyBtn>
                    <span style={{fontWeight:700,minWidth:18,textAlign:"center",fontFamily:"'DM Sans',sans-serif"}}>{item.qty}</span>
                    <QtyBtn onClick={()=>changeQty(item.key,1)}>+</QtyBtn>
                    <span style={{fontWeight:700,minWidth:52,textAlign:"right",fontSize:13,fontFamily:"'DM Sans',sans-serif"}}>E£{item.price*item.qty}</span>
                    <Btn onClick={()=>removeItem(item.key)} style={{color:"var(--muted)",fontSize:16,background:"none",padding:"2px 4px"}}>🗑</Btn>
                  </div>
                </div>
              ))}
            </div>

            <div style={{padding:"18px 22px",borderTop:"1px solid var(--border)"}}>
              <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:18,marginBottom:8,color:"var(--dark)"}}>
                <span>Total</span><span>E£{cartTotal}</span>
              </div>
              {cart.length>0&&(
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:14,
                  background:"#fffbeb",borderRadius:8,padding:"7px 11px",fontSize:12,fontFamily:"'DM Sans',sans-serif",color:"#7a4428"}}>
                  ⭐ You'll earn <strong style={{marginLeft:3}}>{cartPts} reward points</strong> with this order
                </div>
              )}

              {/* CUSTOMER DETAILS FORM */}
              {!customer&&(
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:13,fontWeight:600,fontFamily:"'DM Sans',sans-serif",color:"var(--dark)",marginBottom:10}}>Your Details</div>
                  {[
                    {key:"name",placeholder:"Full Name *",type:"text",icon:"👤"},
                    {key:"phone",placeholder:"Phone Number *",type:"tel",icon:"📞"},
                    {key:"email",placeholder:"Email Address (optional)",type:"email",icon:"✉️"},
                  ].map(f=>(
                    <div key={f.key} style={{marginBottom:8}}>
                      <div style={{position:"relative"}}>
                        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:14}}>{f.icon}</span>
                        <input
                          value={formData[f.key]}
                          onChange={e=>setFormData(p=>({...p,[f.key]:e.target.value}))}
                          placeholder={f.placeholder}
                          type={f.type}
                          style={{
                            width:"100%",padding:"9px 12px 9px 34px",
                            border:`1.5px solid ${formErr[f.key]?"#b71c1c":"var(--border)"}`,
                            borderRadius:30,fontSize:13,fontFamily:"'DM Sans',sans-serif",
                            outline:"none",background:"var(--cream)",color:"var(--dark)",
                          }}
                        />
                      </div>
                      {formErr[f.key]&&<div style={{color:"#b71c1c",fontSize:11,marginTop:3,paddingLeft:12,fontFamily:"'DM Sans',sans-serif"}}>{formErr[f.key]}</div>}
                    </div>
                  ))}
                </div>
              )}
              {customer&&(
                <div style={{fontSize:13,fontFamily:"'DM Sans',sans-serif",color:"var(--muted)",marginBottom:12}}>
                  Ordering as <strong style={{color:"var(--dark)"}}>{customer.name}</strong>
                  {customer.phone&&<span> · {customer.phone}</span>}
                </div>
              )}

              <Btn onClick={handleConfirmOrder} disabled={cart.length===0}
                style={{width:"100%",background:"var(--dark)",color:"var(--cream)",borderRadius:40,
                  padding:"14px",fontSize:15,fontWeight:700,letterSpacing:".03em"}}>
                Confirm Order →
              </Btn>
            </div>
          </div>
        </>
      )}

      {/* ─── CONFIRM MODAL ─── */}
      {confirmModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(26,12,4,.5)",zIndex:500,
          display:"flex",alignItems:"center",justifyContent:"center",animation:"fadeIn .2s ease",padding:"20px"}}
          onClick={()=>setConfirmModal(false)}>
          <div onClick={e=>e.stopPropagation()} style={{
            background:"var(--white)",borderRadius:20,padding:"36px 32px",maxWidth:400,width:"100%",
            animation:"pop .4s cubic-bezier(.34,1.56,.64,1)",
          }}>
            <div style={{fontSize:40,textAlign:"center",marginBottom:12}}>🧾</div>
            <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:28,fontStyle:"italic",color:"var(--dark)",textAlign:"center",marginBottom:6}}>Confirm Order</h2>
            <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"var(--muted)",textAlign:"center",marginBottom:18}}>
              Review your order before placing it
            </div>
            <div style={{background:"var(--cream)",borderRadius:12,padding:"12px 14px",marginBottom:14}}>
              {cart.map(item=>(
                <div key={item.key} style={{display:"flex",justifyContent:"space-between",fontSize:13,
                  fontFamily:"'DM Sans',sans-serif",color:"var(--dark)",padding:"3px 0"}}>
                  <span>{item.name} ×{item.qty}</span><span style={{fontWeight:600}}>E£{item.price*item.qty}</span>
                </div>
              ))}
              <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:16,
                marginTop:10,paddingTop:10,borderTop:"1px solid var(--border)",color:"var(--dark)"}}>
                <span>Total</span><span>E£{cartTotal}</span>
              </div>
            </div>
            <div style={{background:"#fffbeb",borderRadius:10,padding:"8px 12px",marginBottom:18,
              display:"flex",alignItems:"center",gap:6,fontSize:12,fontFamily:"'DM Sans',sans-serif",color:"#7a4428"}}>
              ⭐ You'll earn <strong>{cartPts} reward points</strong> with this order!
            </div>
            <div style={{display:"flex",gap:10}}>
              <Btn onClick={()=>setConfirmModal(false)} style={{flex:1,background:"var(--sand)",color:"var(--dark)",borderRadius:30,padding:"12px",fontSize:14,fontWeight:600}}>
                ← Back
              </Btn>
              <Btn onClick={placeOrder} style={{flex:2,background:"var(--dark)",color:"var(--cream)",borderRadius:30,padding:"12px",fontSize:14,fontWeight:700}}>
                Place Order ✓
              </Btn>
            </div>
          </div>
        </div>
      )}

      {/* ─── SUCCESS MODAL ─── */}
      {successModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(26,12,4,.5)",zIndex:500,
          display:"flex",alignItems:"center",justifyContent:"center",animation:"fadeIn .2s ease",padding:"20px"}}
          onClick={()=>{setSuccessModal(null);setPage("orders");}}>
          <div onClick={e=>e.stopPropagation()} style={{
            background:"var(--white)",borderRadius:24,padding:"42px 36px",maxWidth:400,width:"100%",
            textAlign:"center",animation:"pop .45s cubic-bezier(.34,1.56,.64,1)",
          }}>
            <div style={{fontSize:64,marginBottom:14,animation:"bump .5s .2s ease both"}}>🎉</div>
            <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:32,fontStyle:"italic",color:"var(--dark)",marginBottom:8}}>Order Placed!</h2>
            <p style={{color:"var(--muted)",fontFamily:"'DM Sans',sans-serif",fontSize:14,lineHeight:1.7,marginBottom:16}}>
              Thank you, <strong style={{color:"var(--dark)"}}>{successModal.name}</strong>!<br/>Your order is being received.
            </p>
            <div style={{background:"#fffbeb",borderRadius:12,padding:"12px 16px",marginBottom:20,
              display:"flex",alignItems:"center",gap:8,justifyContent:"center"}}>
              <span style={{fontSize:20}}>⭐</span>
              <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"#7a4428"}}>
                You earned <strong>{successModal.pts} reward points</strong>!
              </span>
            </div>
            <Btn onClick={()=>{setSuccessModal(null);setPage("orders");}} style={{
              width:"100%",background:"var(--dark)",color:"var(--cream)",borderRadius:40,
              padding:"14px",fontSize:15,fontWeight:700,
            }}>Track My Order</Btn>
          </div>
        </div>
      )}

      {/* ─── TOAST ─── */}
      {toast&&(
        <div style={{
          position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",
          background:toast.type==="error"?"#b71c1c":"var(--dark)",color:"var(--cream)",
          padding:"13px 26px",borderRadius:40,fontSize:14,fontFamily:"'DM Sans',sans-serif",
          zIndex:600,boxShadow:"0 8px 28px rgba(26,12,4,.3)",animation:"pop .35s ease",whiteSpace:"nowrap",
        }}>{toast.msg}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

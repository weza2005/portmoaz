
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BrewHouse — Cashier Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0503;--surface:#120801;--card:#1c0f07;--card2:#221207;
  --border:#2e1a0d;--border2:#3a2210;
  --cream:#faf6f0;--gold:#c9943a;--gold2:#e8b96a;--amber:#d47a2a;
  --green:#2d7a4f;--green-bg:#0c1e14;--green-t:#6ecf9e;
  --yellow:#c8940a;--yellow-bg:#1a1000;--yellow-t:#f5d060;
  --red:#c03030;--red-bg:#1a0808;--red-t:#f07070;
  --blue:#2563eb;--blue-bg:#0d1629;--blue-t:#7eb8f7;
  --text:#f0e6d3;--muted:#8a6248;--dim:#5a3e28;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes alertIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(201,148,58,.5)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
@keyframes flash{0%,100%{border-color:var(--border)}50%{border-color:var(--gold);box-shadow:0 0 18px rgba(201,148,58,.3)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes barGrow{from{width:0}to{width:var(--w)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.tab-btn{background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--muted);
  font-size:12px;padding:6px 10px;border-radius:8px;transition:all .15s;}
.tab-btn.active{background:var(--card2);color:var(--gold2);}
.tab-btn:hover:not(.active){color:var(--text);}
.action-btn{font-family:'DM Sans',sans-serif;border:1px solid transparent;border-radius:8px;
  padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.04em;
  text-transform:uppercase;transition:all .18s;}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ═══════════════════════════════════════════════════════
   BREWHOUSE CASHIER DASHBOARD — Full ERP System
   Odoo/Zoho-style analytics, order management,
   CRM, inventory, staff performance & more
═══════════════════════════════════════════════════════ */

// ─── STATE ───────────────────────────────────────────
let state = {
  orders: [],
  filter: "all",
  sort: "newest",
  tab: "orders",     // orders | analytics | crm | inventory | staff | settings
  dailyTarget: 10000,
  orderId: 1,
  customers: [],
  inventory: [
    {name:"Espresso Beans",unit:"kg",stock:12,min:5,cost:180,cat:"Coffee"},
    {name:"Whole Milk",unit:"L",stock:30,min:10,cost:25,cat:"Dairy"},
    {name:"Oat Milk",unit:"L",stock:15,min:5,cost:55,cat:"Dairy"},
    {name:"Matcha Powder",unit:"kg",stock:3,min:1,cost:450,cat:"Tea"},
    {name:"Croissant Dough",unit:"pcs",stock:40,min:20,cost:18,cat:"Bakery"},
    {name:"Cheesecake Mix",unit:"kg",stock:8,min:3,cost:120,cat:"Desserts"},
    {name:"Paper Cups S",unit:"pcs",stock:500,min:100,cost:1.2,cat:"Packaging"},
    {name:"Paper Cups L",unit:"pcs",stock:320,min:100,cost:1.8,cat:"Packaging"},
    {name:"Sugar",unit:"kg",stock:20,min:5,cost:15,cat:"Pantry"},
    {name:"Vanilla Syrup",unit:"L",stock:4,min:1,cost:95,cat:"Syrups"},
    {name:"Caramel Syrup",unit:"L",stock:3.5,min:1,cost:95,cat:"Syrups"},
    {name:"Pistachio Paste",unit:"kg",stock:2,min:.5,cost:650,cat:"Special"},
  ],
  staff: [
    {name:"Ahmed",role:"Barista",orders:0,revenue:0,rating:4.8,shift:"Morning"},
    {name:"Sara",role:"Cashier",orders:0,revenue:0,rating:4.9,shift:"Morning"},
    {name:"Mohamed",role:"Barista",orders:0,revenue:0,rating:4.7,shift:"Evening"},
    {name:"Nour",role:"Runner",orders:0,revenue:0,rating:4.6,shift:"Evening"},
  ],
  settings: {
    target: 10000,
    vat: 14,
    currency: "E£",
    pointsRate: 10,
    instagramUrl: "https://www.instagram.com/",
    whatsapp: "",
  },
  catRevenue: {},
  itemCounts: {},
  hourlyRevenue: Array(24).fill(0),
  notifications: [],
  lastStorageCheck: null,
};

const DEMO_NAMES=["Ahmed","Sara","Mohamed","Nour","Youssef","Rana","Karim","Layla","Omar","Dina","Mona","Hassan"];
const DEMO_ITEMS=[
  {name:"Pistachio Latte",price:190,cat:"Hot Coffee"},{name:"Caramel Latte",price:155,cat:"Ice Coffee"},
  {name:"Croissant",price:100,cat:"Bakeries"},{name:"Spanish Matcha",price:200,cat:"Iced Drinks"},
  {name:"Espresso",price:95,cat:"Hot Coffee"},{name:"Tiramisu",price:160,cat:"Desserts"},
  {name:"Mocha",price:170,cat:"Ice Coffee"},{name:"San Sebastian",price:190,cat:"Desserts"},
  {name:"Turkey Cheese",price:170,cat:"Sandwiches"},{name:"Matcha",price:180,cat:"Iced Drinks"},
  {name:"Latte",price:135,cat:"Hot Coffee"},{name:"Americano",price:110,cat:"Hot Coffee"},
  {name:"Greek Salad",price:175,cat:"Salads"},{name:"Cheesecake Cup",price:170,cat:"Desserts"},
  {name:"Blueberry Smoothie",price:135,cat:"Smoothies"},{name:"V60",price:170,cat:"Speciality Coffee"},
];

function genId(){ return "BH-"+String(state.orderId++).padStart(4,"0"); }
function now(){ return new Date().toLocaleTimeString("en-EG",{hour:"2-digit",minute:"2-digit"}); }

function processOrderStats(order){
  order.items.forEach(item=>{
    const n=item.name; const amt=item.price*(item.qty||1);
    state.itemCounts[n]=(state.itemCounts[n]||0)+(item.qty||1);
    state.catRevenue[item.cat]=(state.catRevenue[item.cat]||0)+amt;
    // hourly
    const h=new Date().getHours();
    state.hourlyRevenue[h]=(state.hourlyRevenue[h]||0)+amt;
  });
  // assign to staff
  const barista=state.staff.filter(s=>s.role==="Barista");
  if(barista.length){
    const s=barista[state.orderId%barista.length];
    s.orders++; s.revenue+=order.total;
  }
  // CRM
  const existing=state.customers.find(c=>c.name===order.name);
  if(existing){
    existing.orders++;existing.spent+=order.total;
    existing.pts=(existing.pts||0)+Math.floor(order.total*.1);
    existing.last=now();
  } else {
    state.customers.push({
      name:order.name,phone:order.phone||"—",email:order.email||"—",
      orders:1,spent:order.total,pts:Math.floor(order.total*.1),
      first:now(),last:now(),
    });
  }
}

function receiveOrder(incoming){
  const order={
    id:incoming.id||genId(),
    name:incoming.name||"Customer",
    phone:incoming.phone||"",
    email:incoming.email||"",
    items:incoming.items||[],
    total:incoming.total||0,
    time:incoming.time||now(),
    status:"received",
    receivedAt:Date.now(),
  };
  state.orders.unshift(order);
  processOrderStats(order);
  showAlert(order);
  render();
}

// Poll localStorage for customer orders
setInterval(()=>{
  try{
    const raw=localStorage.getItem("brewhouse_order");
    if(raw&&raw!==state.lastStorageCheck){
      state.lastStorageCheck=raw;
      const inc=JSON.parse(raw);
      if(!state.orders.find(o=>o.id===inc.id)) receiveOrder(inc);
    }
  }catch(e){}
},800);

window.addEventListener("storage",e=>{
  if(e.key==="brewhouse_order"&&e.newValue){
    try{ const inc=JSON.parse(e.newValue); if(!state.orders.find(o=>o.id===inc.id)) receiveOrder(inc); }catch(e){}
  }
});

function addDemoOrder(){
  const name=DEMO_NAMES[Math.floor(Math.random()*DEMO_NAMES.length)];
  const n=Math.floor(Math.random()*3)+1;
  const items=[],used=new Set();
  for(let i=0;i<n;i++){
    let idx; do{idx=Math.floor(Math.random()*DEMO_ITEMS.length);}while(used.has(idx));
    used.add(idx);
    const item=DEMO_ITEMS[idx];
    items.push({...item,qty:Math.random()>.6?2:1,key:item.name+i});
  }
  const total=items.reduce((s,i)=>s+i.price*(i.qty||1),0);
  receiveOrder({id:genId(),name,phone:"+2010"+(Math.floor(Math.random()*100000000)).toString().padStart(8,"0"),
    email:`${name.toLowerCase()}@email.com`,items,total});
}

function updateStatus(id,status){
  const o=state.orders.find(x=>x.id===id);
  if(o){o.status=status;render();}
}

function cancelOrder(id){
  if(!confirm("Cancel this order?")) return;
  const o=state.orders.find(x=>x.id===id);
  if(o){o.status="cancelled";render();}
}

function setFilter(f){ state.filter=f; render(); }
function setSort(s){ state.sort=s; render(); }
function setTab(t){ state.tab=t; render(); }

// ─── ALERTS ──────────────────────────────────────────
function showAlert(order){
  const id=Date.now();
  state.notifications.unshift({id,order,time:now()});
  if(state.notifications.length>50) state.notifications.pop();

  const el=document.createElement("div");
  el.style.cssText=`position:fixed;top:78px;right:20px;z-index:9999;
    background:#1c0f07;border:1px solid #c9943a;border-radius:14px;
    padding:14px 18px;display:flex;align-items:center;gap:12px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);animation:alertIn .4s cubic-bezier(.22,1,.36,1);
    max-width:310px;cursor:pointer;`;
  el.innerHTML=`
    <span style="font-size:26px">🔔</span>
    <div style="flex:1">
      <div style="font-size:13px;font-weight:600;color:#f0e6d3">${order.name}</div>
      <div style="font-size:11px;color:#8a6248;margin-top:2px">${order.id} · E£${order.total} · ${order.items.length} item(s)</div>
    </div>
    <button onclick="this.parentElement.remove()" style="background:none;border:none;color:#5a3e28;font-size:18px;cursor:pointer">×</button>`;
  // Bell sound
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.connect(g);g.connect(ctx.destination);
    osc.frequency.setValueAtTime(880,ctx.currentTime);
    osc.frequency.setValueAtTime(1100,ctx.currentTime+.1);
    g.gain.setValueAtTime(.12,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);
    osc.start();osc.stop(ctx.currentTime+.4);
  }catch(e){}
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0";el.style.transition="opacity .4s";setTimeout(()=>el.remove(),400); },4500);
}

// ─── STATS ───────────────────────────────────────────
function getStats(){
  const active=state.orders.filter(o=>o.status!=="cancelled");
  const total=active.length;
  const revenue=active.reduce((s,o)=>s+o.total,0);
  const avg=total>0?Math.round(revenue/total):0;
  const pct=Math.min(100,Math.round(revenue/state.settings.target*100));
  const countByStatus=(st)=>state.orders.filter(o=>o.status===st).length;
  return{total,revenue,avg,pct,
    received:countByStatus("received"),preparing:countByStatus("preparing"),
    ready:countByStatus("ready"),done:countByStatus("done"),
  };
}

// ─── CLOCK ───────────────────────────────────────────
function updateClock(){
  const el=document.getElementById("clock");
  if(el) el.textContent=new Date().toLocaleTimeString("en-EG",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
setInterval(updateClock,1000);

// ─── RENDER ──────────────────────────────────────────
function render(){
  const root=document.getElementById("root");
  if(!root) return;
  root.innerHTML=buildUI();
  updateClock();
}

function buildUI(){
  return `
  ${buildHeader()}
  <div style="display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 60px);position:relative;z-index:1;">
    ${buildSidebar()}
    <div style="overflow:hidden;">
      ${buildMain()}
    </div>
  </div>
  ${buildTabBar()}
  `;
}

// ─── HEADER ──────────────────────────────────────────
function buildHeader(){
  const s=getStats();
  return `
  <header style="position:sticky;top:0;z-index:100;background:rgba(10,5,3,.9);
    backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
    padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--gold2);letter-spacing:.02em;">Brew House</div>
      <span style="font-size:10px;color:var(--dim);font-weight:500;letter-spacing:.1em;text-transform:uppercase;border-left:1px solid var(--border);padding-left:12px;">Cashier Dashboard</span>
    </div>
    <div style="display:flex;align-items:center;gap:18px;">
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green-t);">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--green-t);display:inline-block;animation:pulseDot 2s infinite;"></span>
        Live
      </div>
      <div style="font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;" id="clock">--:--:--</div>
      <div style="font-size:11px;color:var(--muted);">Revenue: <strong style="color:var(--gold2);">E£${s.revenue.toLocaleString()}</strong></div>
      <button onclick="addDemoOrder()" style="background:linear-gradient(135deg,var(--gold),var(--amber));color:#000;
        font-weight:700;font-family:'DM Sans',sans-serif;border:none;padding:8px 18px;
        border-radius:10px;cursor:pointer;font-size:12px;letter-spacing:.03em;">
        + Simulate Order
      </button>
    </div>
  </header>`;
}

// ─── SIDEBAR ──────────────────────────────────────────
function buildSidebar(){
  const s=getStats();
  const tabs=[
    {id:"orders",icon:"📋",label:"Orders"},
    {id:"analytics",icon:"📊",label:"Analytics"},
    {id:"crm",icon:"👥",label:"Customers"},
    {id:"inventory",icon:"📦",label:"Inventory"},
    {id:"staff",icon:"👤",label:"Staff"},
    {id:"settings",icon:"⚙️",label:"Settings"},
  ];
  return `
  <aside style="border-right:1px solid var(--border);background:var(--surface);
    display:flex;flex-direction:column;gap:0;overflow-y:auto;height:calc(100vh - 60px);">
    <!-- Stats -->
    <div style="padding:20px 16px;border-bottom:1px solid var(--border);">
      ${statCard("Today's Orders",s.total,"","#c9943a")}
      ${statCard("Revenue","E£"+s.revenue.toLocaleString(),"","")}
      ${statCard("Avg Order","E£"+s.avg,"","")}
      <!-- Progress bar -->
      <div style="margin-top:14px;">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:5px;">
          <span>Daily Target</span><span>${s.pct}%</span>
        </div>
        <div style="height:4px;background:var(--border);border-radius:4px;overflow:hidden;">
          <div style="height:100%;background:linear-gradient(90deg,var(--gold),var(--amber));width:${s.pct}%;border-radius:4px;transition:width .8s;"></div>
        </div>
        <div style="font-size:10px;color:var(--dim);margin-top:4px;">E£${state.settings.target.toLocaleString()} target</div>
      </div>
    </div>

    <!-- Nav -->
    <nav style="padding:14px 10px;flex:1;">
      <div style="font-size:9px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;padding:0 8px 8px;font-weight:600;">Navigation</div>
      ${tabs.map(t=>`
        <button onclick="setTab('${t.id}')" style="display:flex;align-items:center;gap:10px;
          width:100%;padding:10px 12px;border-radius:10px;border:none;cursor:pointer;
          background:${state.tab===t.id?"var(--card2)":"none"};
          color:${state.tab===t.id?"var(--gold2)":"var(--muted)"};
          font-family:'DM Sans',sans-serif;font-size:13px;font-weight:${state.tab===t.id?600:400};
          text-align:left;margin-bottom:2px;transition:all .15s;
          border-left:${state.tab===t.id?"2px solid var(--gold)":"2px solid transparent"};">
          <span style="font-size:15px;">${t.icon}</span>
          <span>${t.label}</span>
          ${t.id==="orders"&&s.received>0?`<span style="margin-left:auto;background:var(--yellow);color:#000;font-size:9px;font-weight:700;padding:1px 7px;border-radius:10px;">${s.received}</span>`:""}
        </button>
      `).join("")}
    </nav>

    <!-- Filter (only for orders tab) -->
    ${state.tab==="orders"?`
    <div style="padding:14px 10px;border-top:1px solid var(--border);">
      <div style="font-size:9px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;padding:0 6px 8px;font-weight:600;">Filter Orders</div>
      ${[["all","☕","All",s.total+state.orders.filter(o=>o.status==="cancelled").length],
         ["received","⏳","Received",s.received],
         ["preparing","🍳","Preparing",s.preparing],
         ["ready","✅","Ready",s.ready],
         ["done","📦","Done",s.done]].map(([f,ic,lb,ct])=>`
        <button onclick="setFilter('${f}')" style="display:flex;align-items:center;gap:8px;
          width:100%;padding:8px 10px;border-radius:9px;border:${state.filter===f?"1px solid var(--border2)":"1px solid transparent"};
          background:${state.filter===f?"var(--card)":"none"};cursor:pointer;
          color:${state.filter===f?"var(--gold2)":"var(--muted)"};
          font-family:'DM Sans',sans-serif;font-size:12px;text-align:left;
          margin-bottom:2px;transition:all .15s;">
          <span>${ic}</span><span>${lb}</span>
          <span style="margin-left:auto;background:${state.filter===f?"var(--gold)":"var(--border2)"};
            color:${state.filter===f?"#000":"var(--muted)"};
            font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;">${ct}</span>
        </button>
      `).join("")}
    </div>`:""}
  </aside>`;
}

function statCard(label,value,sub,color){
  return `
  <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;">
    <div style="font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${label}</div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold2);line-height:1;">${value}</div>
    ${sub?`<div style="font-size:10px;color:var(--dim);margin-top:4px;">${sub}</div>`:""}
  </div>`;
}

// ─── MAIN CONTENT ──────────────────────────────────────
function buildMain(){
  switch(state.tab){
    case "orders":    return buildOrdersTab();
    case "analytics": return buildAnalyticsTab();
    case "crm":       return buildCRMTab();
    case "inventory": return buildInventoryTab();
    case "staff":     return buildStaffTab();
    case "settings":  return buildSettingsTab();
    default:          return buildOrdersTab();
  }
}

// ─── ORDERS TAB ──────────────────────────────────────
function buildOrdersTab(){
  let filtered=state.orders.filter(o=>state.filter==="all"?o.status!=="cancelled":o.status===state.filter);
  if(state.sort==="oldest") filtered=[...filtered].reverse();
  else if(state.sort==="total-high") filtered=[...filtered].sort((a,b)=>b.total-a.total);
  else if(state.sort==="total-low") filtered=[...filtered].sort((a,b)=>a.total-b.total);

  // Right panel: queue + top items
  const active=state.orders.filter(o=>o.status==="received"||o.status==="preparing");
  const topItems=Object.entries(state.itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxItem=topItems[0]?.[1]||1;

  return `
  <div style="display:grid;grid-template-columns:1fr 290px;height:calc(100vh - 60px);overflow:hidden;">
    <!-- Orders list -->
    <div style="padding:20px;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <h1 style="font-family:'Cormorant Garamond',serif;font-size:28px;font-style:italic;color:var(--cream);">
          ${{all:"All Orders",received:"Received",preparing:"Preparing",ready:"Ready",done:"Completed"}[state.filter]||"Orders"}
        </h1>
        <select onchange="setSort(this.value)" style="background:var(--card);border:1px solid var(--border);
          color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;padding:6px 10px;border-radius:8px;cursor:pointer;outline:none;">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="total-high">Highest Total</option>
          <option value="total-low">Lowest Total</option>
        </select>
      </div>

      ${filtered.length===0?`
        <div style="text-align:center;padding:80px 24px;color:var(--dim);">
          <div style="font-size:56px;margin-bottom:14px;opacity:.4">☕</div>
          <div style="font-size:16px;font-style:italic;color:var(--muted);">No orders yet — waiting for magic</div>
          <div style="font-size:12px;color:var(--dim);margin-top:6px;">Click "+ Simulate Order" or open the customer page</div>
        </div>
      `:filtered.map((order,i)=>buildOrderCard(order,i)).join("")}
    </div>

    <!-- Right panel -->
    <div style="border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:18px 16px;">
      <div style="font-family:'Cormorant Garamond',serif;font-size:17px;font-style:italic;color:var(--cream);margin-bottom:14px;">Active Queue</div>
      ${active.length===0?`<div style="font-size:12px;color:var(--dim);text-align:center;padding:20px;">No active orders</div>`:
        active.map(o=>`

function buildOrderCard(order,i){
  const elapsed=Math.floor((Date.now()-order.receivedAt)/60000);
  const urgent=order.status==="received"&&elapsed>=5;
  const steps=["received","preparing","ready","done"];
  const stepIdx=steps.indexOf(order.status);

  const statusColor={received:"var(--yellow-t)",preparing:"var(--gold2)",ready:"var(--green-t)",done:"var(--dim)",cancelled:"var(--red-t)"};
  const statusBg={received:"var(--yellow-bg)",preparing:"rgba(201,148,58,.08)",ready:"var(--green-bg)",done:"rgba(90,62,40,.15)",cancelled:"var(--red-bg)"};

  let buttons="";
  if(order.status==="received") buttons=`
    <button onclick="updateStatus('${order.id}','preparing')" class="action-btn" style="background:rgba(201,148,58,.1);color:var(--gold2);border-color:rgba(201,148,58,.3);">🍳 Prepare</button>
    <button onclick="cancelOrder('${order.id}')" class="action-btn" style="background:var(--red-bg);color:var(--red-t);border-color:rgba(192,48,48,.2);">✕</button>`;
  else if(order.status==="preparing") buttons=`
    <button onclick="updateStatus('${order.id}','ready')" class="action-btn" style="background:var(--green-bg);color:var(--green-t);border-color:rgba(46,122,79,.25);">✅ Ready</button>`;
  else if(order.status==="ready") buttons=`
    <button onclick="updateStatus('${order.id}','done')" class="action-btn" style="background:rgba(90,62,40,.2);color:var(--muted);border-color:var(--border);">📦 Done</button>`;

  return `
  <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;
    margin-bottom:10px;position:relative;overflow:hidden;
    animation:fadeUp .35s ease both;animation-delay:${i*.04}s;opacity:0;
    border-left:3px solid ${statusColor[order.status]||"var(--border)"};">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;">
      <div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--cream);font-weight:600;">${order.name}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px;">
          ${order.id} · ${order.time}
          ${order.phone?` · ${order.phone}`:""}
          ${elapsed>0?` · <span style="color:${urgent?"var(--red-t)":"var(--dim)"}; ${urgent?"animation:blink 1s step-end infinite;":""}">${elapsed}m ago</span>`:""}
        </div>
      </div>
      <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;
        font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
        background:${statusBg[order.status]||"transparent"};color:${statusColor[order.status]||"var(--muted)"};">
        ${{received:"⏳ Received",preparing:"🍳 Preparing",ready:"✅ Ready",done:"📦 Done",cancelled:"✕ Cancelled"}[order.status]||order.status}
      </span>
    </div>

    <!-- Progress steps -->
    <div style="display:flex;gap:5px;margin-bottom:12px;">
      ${steps.map((s,si)=>`
        <div style="height:3px;flex:1;border-radius:3px;
          background:${si<stepIdx?"var(--gold)":si===stepIdx?"var(--gold2)":"var(--border)"};
          ${si===stepIdx&&order.status!=="done"?"animation:pulseDot 1.5s ease infinite;":""};
          transition:background .4s;">
        </div>
      `).join("")}
    </div>

    <!-- Items -->
    <div style="border-top:1px solid var(--border);padding-top:10px;margin-bottom:12px;">
      ${order.items.map(item=>`
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:3px 0;">
          <span>${item.name} <span style="opacity:.5">×${item.qty||1}</span></span>
          <span style="color:var(--text);font-weight:500;">E£${item.price*(item.qty||1)}</span>
        </div>
      `).join("")}
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--gold2);">E£${order.total}</div>
      <div style="display:flex;gap:7px;">${buttons}</div>
    </div>
  </div>`;
}

          </div>
          <div style="font-size:15px;font-weight:700;color:var(--cream);margin-bottom:2px;">${s.name}</div>
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;">${s.role} · ${s.shift}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
            <div style="background:var(--card2);border-radius:8px;padding:8px 6px;">
              <div style="font-size:18px;font-family:'Cormorant Garamond',serif;color:var(--gold2);">${s.orders}</div>
              <div style="font-size:9px;color:var(--dim);">Orders</div>
            </div>
            <div style="background:var(--card2);border-radius:8px;padding:8px 6px;">
              <div style="font-size:14px;font-family:'Cormorant Garamond',serif;color:var(--green-t);">E£${s.revenue.toLocaleString()}</div>
              <div style="font-size:9px;color:var(--dim);">Revenue</div>
            </div>
          </div>
          <!-- Rating -->
          <div style="font-size:12px;color:var(--amber);">${"★".repeat(Math.round(s.rating))}${"☆".repeat(5-Math.round(s.rating))}</div>
          <div style="font-size:10px;color:var(--dim);margin-top:2px;">${s.rating}/5.0</div>
          <!-- Performance bar -->
          <div style="margin-top:10px;">
            <div style="font-size:9px;color:var(--dim);margin-bottom:3px;text-align:left;">Orders share</div>
            <div style="height:3px;background:var(--border);border-radius:3px;overflow:hidden;">
              <div style="height:100%;background:linear-gradient(90deg,var(--gold),var(--amber));
                width:${s.orders>0?Math.round(s.orders/totalOrd*100):0}%;border-radius:3px;"></div>
            </div>
          </div>
        </div>
      `).join("")}
    </div>

    <!-- Staff table -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--cream);">Detailed Performance</div>
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);">
            ${["Staff","Role","Shift","Orders","Revenue","Avg/Order","Rating"].map(h=>`
              <th style="padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-weight:500;">${h}</th>
            `).join("")}
          </tr>
        </thead>
        <tbody>
          ${[...state.staff].sort((a,b)=>b.revenue-a.revenue).map(s=>`
            <tr style="border-bottom:1px solid var(--border);"
              onmouseover="this.style.background='var(--card2)'" onmouseout="this.style.background=''">
              <td style="padding:10px 14px;font-size:13px;font-weight:600;color:var(--cream);">${s.name}</td>
              <td style="padding:10px 14px;font-size:12px;color:var(--muted);">${s.role}</td>
              <td style="padding:10px 14px;font-size:12px;color:var(--muted);">${s.shift}</td>
              <td style="padding:10px 14px;font-size:14px;font-weight:700;color:var(--cream);">${s.orders}</td>
              <td style="padding:10px 14px;font-size:13px;font-weight:700;color:var(--gold2);">E£${s.revenue.toLocaleString()}</td>
              <td style="padding:10px 14px;font-size:12px;color:var(--muted);">${s.orders>0?"E£"+Math.round(s.revenue/s.orders):"—"}</td>
              <td style="padding:10px 14px;font-size:13px;color:var(--amber);">${s.rating} ★</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ─── SETTINGS TAB ─────────────────────────────────────
function buildSettingsTab(){
  return `
  <div style="padding:24px;overflow-y:auto;height:calc(100vh - 60px);max-width:700px;">
    <h1 style="font-family:'Cormorant Garamond',serif;font-size:28px;font-style:italic;color:var(--cream);margin-bottom:20px;">Settings</h1>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;">
      <div style="font-size:14px;font-weight:600;color:var(--cream);margin-bottom:16px;">💰 Financial Settings</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        ${settingInput("Daily Revenue Target (E£)","settings-target",state.settings.target,"number")}
        ${settingInput("VAT Rate (%)","settings-vat",state.settings.vat,"number")}
        ${settingInput("Currency Symbol","settings-currency",state.settings.currency,"text")}
        ${settingInput("Points Cashback (%)","settings-points",state.settings.pointsRate,"number")}
      </div>
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;">
      <div style="font-size:14px;font-weight:600;color:var(--cream);margin-bottom:16px;">📱 Social & Contact</div>
      ${settingInput("Instagram URL","settings-instagram",state.settings.instagramUrl,"url")}
      ${settingInput("WhatsApp Number","settings-whatsapp",state.settings.whatsapp,"tel")}
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;">
      <div style="font-size:14px;font-weight:600;color:var(--cream);margin-bottom:16px;">🎬 Daily Video (Customer Page)</div>
      <p style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px;">
        The customer homepage video changes automatically every day of the week. Configure video URLs per day by editing the <code style="background:var(--card2);padding:1px 5px;border-radius:4px;color:var(--gold2);">DAY_VIDEOS</code> array in the customer HTML file.
      </p>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">
        ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d,i)=>`
          <div style="text-align:center;background:${new Date().getDay()===i?"linear-gradient(135deg,rgba(201,148,58,.15),rgba(232,185,106,.08))":"var(--card2)"};
            border:1px solid ${new Date().getDay()===i?"var(--gold)":"var(--border)"};
            border-radius:8px;padding:10px 6px;">
            <div style="font-size:10px;color:${new Date().getDay()===i?"var(--gold2)":"var(--dim)"};">${d}</div>
            <div style="font-size:16px;margin-top:4px;">🎬</div>
            ${new Date().getDay()===i?`<div style="font-size:9px;color:var(--gold);margin-top:2px;">TODAY</div>`:""}
          </div>
        `).join("")}
      </div>
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;">
      <div style="font-size:14px;font-weight:600;color:var(--cream);margin-bottom:16px;">🔗 Quick Links</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button onclick="window.open(state.settings.instagramUrl,'_blank')" style="background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
          color:#fff;border:none;border-radius:8px;padding:10px 18px;font-family:'DM Sans',sans-serif;
          font-size:12px;font-weight:600;cursor:pointer;">📷 Open Instagram</button>
        <button onclick="window.open('https://wa.me/'+state.settings.whatsapp,'_blank')" style="background:#25D366;
          color:#fff;border:none;border-radius:8px;padding:10px 18px;font-family:'DM Sans',sans-serif;
          font-size:12px;font-weight:600;cursor:pointer;">💬 WhatsApp</button>
      </div>
    </div>

    <button onclick="saveSettings()" style="background:linear-gradient(135deg,var(--gold),var(--amber));
      color:#000;border:none;border-radius:10px;padding:13px 36px;font-family:'DM Sans',sans-serif;
      font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.03em;">
      Save Settings ✓
    </button>
  </div>`;
}

function settingInput(label,id,value,type){
  return `
  <div style="margin-bottom:12px;">
    <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;">${label}</label>
    <input id="${id}" type="${type}" value="${value}"
      style="width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
        border-radius:8px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;
        transition:border-color .15s;"
      onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='var(--border)'"/>
  </div>`;
}

window.saveSettings=function(){
  state.settings.target=parseInt(document.getElementById("settings-target")?.value)||10000;
  state.settings.vat=parseFloat(document.getElementById("settings-vat")?.value)||14;
  state.settings.currency=document.getElementById("settings-currency")?.value||"E£";
  state.settings.pointsRate=parseFloat(document.getElementById("settings-points")?.value)||10;
  state.settings.instagramUrl=document.getElementById("settings-instagram")?.value||"";
  state.settings.whatsapp=document.getElementById("settings-whatsapp")?.value||"";
  const el=document.body.appendChild(document.createElement("div"));
  el.style.cssText=`position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#1e5c2e;color:#e8f5e9;padding:11px 24px;border-radius:30px;font-size:13px;
    font-family:'DM Sans',sans-serif;z-index:9999;font-weight:600;`;
  el.textContent="✓ Settings saved";
  setTimeout(()=>el.remove(),2500);
  render();
};

// ─── TAB BAR (bottom on mobile) ───────────────────────
function buildTabBar(){ return ""; } // Already in sidebar

// ─── EXPOSE GLOBALS ──────────────────────────────────
window.addDemoOrder=addDemoOrder;
window.updateStatus=updateStatus;
window.cancelOrder=cancelOrder;
window.setFilter=setFilter;
window.setSort=setSort;
window.setTab=setTab;
window.state=state;

// ─── INIT ─────────────────────────────────────────────
render();
</script>
</body>
</html>

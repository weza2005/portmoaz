<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <title>Echo LMS | منصة معاذ مصطفى التعليمية</title>
    <style>
        body { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.6s ease forwards; }
    </style>
</head>
<body class="bg-[#020617] text-white overflow-hidden">

    <div class="flex h-screen w-full">
        <aside class="w-20 lg:w-72 border-l border-white/5 bg-[#0b1120] flex flex-col transition-all z-50">
            <div class="p-8 text-2xl font-black italic text-cyan-400 tracking-tighter">
                ECHO<span class="text-white">.EDU</span>
            </div>
            
            <nav class="flex-grow px-4 space-y-2">
                <button onclick="showPage('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center gap-4 p-4 rounded-2xl text-cyan-400 bg-cyan-400/10 border-r-4 border-cyan-500 transition-all">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span class="hidden lg:block font-bold">الرئيسية</span>
                </button>
                <button onclick="showPage('courses')" id="nav-courses" class="nav-item w-full flex items-center gap-4 p-4 rounded-2xl text-slate-400 hover:bg-white/5 transition-all">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    <span class="hidden lg:block font-bold">كافة الكورسات</span>
                </button>
            </nav>

            <div class="p-6 border-t border-white/5">
                <div class="flex items-center gap-3 bg-slate-900/50 p-3 rounded-2xl border border-white/5">
                    <div class="w-10 h-10 bg-cyan-600 rounded-full flex items-center justify-center font-bold shadow-lg shadow-cyan-500/20">M</div>
                    <div class="hidden lg:block">
                        <p class="text-xs font-bold truncate w-32">معاذ مصطفى</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-tighter">Pro Student</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-grow overflow-y-auto no-scrollbar relative bg-[#020617]">
            
            <section id="page-dashboard" class="p-8 lg:p-12 animate-fade-in">
                <header class="mb-12">
                    <h1 class="text-4xl font-black mb-2 italic">لوحة <span class="text-cyan-400 text-not-italic">التحكم</span></h1>
                    <p class="text-slate-500">مرحباً بك مجدداً، استكمل رحلة احتراف البرمجة.</p>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                    <div class="bg-gradient-to-br from-cyan-600 to-blue-700 p-8 rounded-[2.5rem] shadow-xl relative overflow-hidden group">
                        <div class="relative z-10">
                            <span class="text-white/80 text-xs font-bold tracking-widest uppercase">الإنجاز الكلي</span>
                            <div class="text-5xl font-black mt-2">78%</div>
                        </div>
                        <div class="absolute -right-4 -bottom-4 opacity-20 group-hover:scale-110 transition-transform duration-700">
                            <svg class="w-32 h-32" fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"></path></svg>
                        </div>
                    </div>
                    <div class="bg-[#0b1120] border border-white/5 p-8 rounded-[2.5rem]">
                        <span class="text-slate-500 text-xs font-bold uppercase">الساعات المنقضية</span>
                        <div class="text-4xl font-black mt-2">124 <span class="text-sm text-slate-600 font-normal">ساعة</span></div>
                    </div>
                    <div class="bg-[#0b1120] border border-white/5 p-8 rounded-[2.5rem]">
                        <span class="text-slate-500 text-xs font-bold uppercase">الشهادات</span>
                        <div class="text-4xl font-black mt-2 text-cyan-400 tracking-tighter">03</div>
                    </div>
                </div>

                <h3 class="text-2xl font-black mb-8 flex items-center gap-3 italic">
                    <span class="w-2 h-8 bg-cyan-500 rounded-full"></span>
                    كورسات قيد التعلم
                </h3>
                <div id="courses-container" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    </div>
            </section>

            <section id="page-lesson" class="hidden h-full flex flex-col lg:flex-row animate-fade-in bg-[#020617]">
                <div class="flex-grow p-6 lg:p-10">
                    <button onclick="showPage('dashboard')" class="mb-6 flex items-center gap-2 text-slate-500 hover:text-white transition-all text-sm font-bold">
                        ← العودة للرئيسية
                    </button>
                    <div class="aspect-video bg-black rounded-[2.5rem] overflow-hidden shadow-2xl border border-white/5 relative group">
                        <iframe id="video-frame" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <div class="mt-8 px-2">
                        <h2 id="lesson-title" class="text-3xl font-black mb-3 text-cyan-400 italic">اسم الدرس يظهر هنا</h2>
                        <p id="lesson-desc" class="text-slate-400 leading-relaxed max-w-4xl text-sm italic">شرح تفصيلي للمحتوى...</p>
                    </div>
                </div>
                <div class="w-full lg:w-96 bg-[#0b1120] border-r border-white/5 p-8 overflow-y-auto no-scrollbar">
                    <h4 class="font-black mb-8 text-xl border-b border-white/5 pb-4 tracking-tighter italic">محتوى المسار</h4>
                    <div id="playlist-container" class="space-y-4">
                        </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        // 1. قاعدة بيانات الكورسات
        const courseData = {
            'react': {
                title: "Advanced React Hooks",
                desc: "تعلم بناء تطبيقات قوية باستخدام UseMemo, UseCallback و Context API الاحترافي.",
                img: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?q=80&w=400",
                video: "https://www.youtube.com/embed/bMknfKXIFA8",
                lessons: ["مقدمة الكورس", "شرح UseState", "التعامل مع useEffect", "احتراف UseMemo"]
            },
            'tailwind': {
                title: "Tailwind CSS Mastery",
                desc: "إتقان التصميم المتجاوب وبناء UI عصري في دقائق معدودة.",
                img: "https://images.unsplash.com/photo-1587620962725-abab7fe55159?q=80&w=400",
                video: "https://www.youtube.com/embed/lCxcTsOHrjo",
                lessons: ["لماذا تيلويند؟", "نظام الـ Grid", "الـ Flexbox المتقدم", "تخصيص الـ Config"]
            }
        };

        // 2. دالة عرض الكورسات في الرئيسية
        function renderDashboard() {
            const container = document.getElementById('courses-container');
            container.innerHTML = '';
            
            Object.keys(courseData).forEach(key => {
                const item = courseData[key];
                container.innerHTML += `
                    <div onclick="openLesson('${key}')" class="group cursor-pointer bg-[#0b1120] border border-white/5 rounded-[2.5rem] p-6 hover:border-cyan-500/50 transition-all animate-fade-in shadow-lg">
                        <div class="flex gap-6 items-center">
                            <div class="w-20 h-20 bg-slate-800 rounded-3xl overflow-hidden shrink-0 border border-white/5">
                                <img src="${item.img}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700">
                            </div>
                            <div class="flex-grow">
                                <h4 class="text-xl font-bold mb-1 group-hover:text-cyan-400 transition-colors">${item.title}</h4>
                                <div class="flex items-center gap-4 text-[10px] text-slate-500 font-bold mb-3 italic">
                                    <span>${item.lessons.length} دروس</span>
                                    <span class="w-1.5 h-1.5 bg-cyan-500 rounded-full"></span>
                                    <span class="text-white tracking-widest">مفتوح الآن</span>
                                </div>
                                <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden">
                                    <div class="bg-cyan-500 h-full w-[20%] group-hover:w-[100%] transition-all duration-[1.5s]"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 3. دالة فتح صفحة الدرس
        function openLesson(id) {
            const data = courseData[id];
            showPage('lesson');
            
            document.getElementById('video-frame').src = data.video;
            document.getElementById('lesson-title').innerText = data.title;
            document.getElementById('lesson-desc').innerText = data.desc;

            const playlist = document.getElementById('playlist-container');
            playlist.innerHTML = '';
            data.lessons.forEach((lesson, i) => {
                const activeClass = i === 0 ? 'bg-cyan-500/10 border-cyan-500/30 text-cyan-400' : 'bg-slate-900/40 border-white/5 text-slate-500 opacity-60';
                playlist.innerHTML += `
                    <div class="p-5 ${activeClass} border rounded-2xl flex gap-4 items-center cursor-pointer hover:opacity-100 transition-all group">
                        <span class="w-8 h-8 ${i === 0 ? 'bg-cyan-500 text-white' : 'bg-slate-800'} rounded-full flex items-center justify-center text-[10px] font-black">${i+1}</span>
                        <div class="text-xs font-bold">${lesson}</div>
                    </div>
                `;
            });
        }

        // 4. دالة التنقل العامة
        function showPage(page) {
            document.getElementById('page-dashboard').classList.add('hidden');
            document.getElementById('page-lesson').classList.add('hidden');
            document.getElementById('page-' + page).classList.remove('hidden');

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('text-cyan-400', 'bg-cyan-400/10', 'border-r-4', 'border-cyan-500');
                btn.classList.add('text-slate-400');
            });
            const activeNav = document.getElementById('nav-' + page);
            if(activeNav) {
                activeNav.classList.add('text-cyan-400', 'bg-cyan-400/10', 'border-r-4', 'border-cyan-500');
                activeNav.classList.remove('text-slate-400');
            }
        }

        // تشغيل أولي
        renderDashboard();
    </script>
</body>
</html>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .product-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }


      
    /* عشان السلة تكون انسيابية وما يطلعش سكرول بار خارجي */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* أنيميشن ظهور المنتجات */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.5s ease forwards; }
 
    /* تصغير الحاوية الأساسية للمنتج */
    .product-card img {
        height: 180px; /* طول ثابت ومناسب للموبايل */
        width: 100%;
        object-fit: cover;
    }
    /* تحسين شكل الكارت */
    .product-card {
        background: #f8fafc;
        border-radius: 1.5rem;
        padding: 8px;
        transition: all 0.3s ease;
    }
    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }


    </style>

let cartItems = []; 

function addToCart(btn, productId) {
    // 1. إيجاد المنتج من القائمة
    const product = products.find(p => p.id === productId);
    
    // 2. إضافته للمصفوفة (تأكد إنها .push)
    cartItems.push({...product}); // بناخد نسخة من المنتج
    
    // 3. تحديث الواجهة
    updateCartUI();
    
    // أنيميشن الزرار (اختياري بس شيك)
    btn.classList.add('bg-green-500');
    setTimeout(() => btn.classList.remove('bg-green-500'), 1000);
}

function updateCartUI() {
    const badge = document.getElementById('cart-count');
    const list = document.getElementById('cart-list');
    const totalLabel = document.getElementById('cart-total');
    const countLabel = document.getElementById('cart-items-count');

    // تحديث الأرقام الأساسية
    badge.innerText = cartItems.length;
    countLabel.innerText = `(${cartItems.length})`;

    // مسح القائمة الحالية عشان نعيد بنائها
    list.innerHTML = '';
    
    // تصفير المجموع قبل الجمع الجديد
    let tempTotal = 0;

    if (cartItems.length === 0) {
        list.innerHTML = '<p class="text-center text-slate-400 py-10 italic">السلة فاضية</p>';
        totalLabel.innerText = '0 ج.م';
        return;
    }

    // الـ Loop اللي بيجمع كل الأسعار
    cartItems.forEach((item, index) => {
        tempTotal += item.price; // دي أهم حتة بتجمع السعر
        
        list.innerHTML += `
            <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-3xl border border-slate-100 mb-3 animate-fade-in">
                <img src="${item.img}" class="w-14 h-14 rounded-2xl object-cover">
                <div class="flex-grow">
                    <h4 class="font-bold text-[12px]">${item.name}</h4>
                    <span class="text-cyan-600 font-black text-xs">${item.price} ج.م</span>
                </div>
                <button onclick="removeFromCart(${index})" class="text-red-400 font-bold px-2">×</button>
            </div>
        `;
    });

    // عرض المجموع النهائي
    totalLabel.innerText = tempTotal + " ج.م";
}

function removeFromCart(index) {
    cartItems.splice(index, 1); // مسح العنصر
    updateCartUI(); // إعادة الحساب
}

});

function updateCartUI() {
    const badge = document.getElementById('cart-count');
    const list = document.getElementById('cart-list');
    const total = document.getElementById('cart-total');

    const countLabel = document.getElementById('cart-items-count');

    // تحديث العداد اللي فوق

        list.innerHTML += `
            <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-3xl border border-slate-100 mb-4 animate-fade-in">

            </div>
        `;
    });

    // كتابة المجموع النهائي بعد ما خلصنا الـ Loop

                    </div>
                    <button onclick="removeFromCart(${index})" class="text-red-400 font-bold p-2 text-xl">×</button>
                </div>
            `;
        });

        total.innerText = `${totalPrice} ج.م`;
    }

    // 6. دالة مسح منتج من السلة
    function removeFromCart(index) {
        cartItems.splice(index, 1);
        updateCartUI();
    }

    // 7. دالة فتح وقفل السلة
    function toggleCart() {
    const modal = document.getElementById('cart-modal');
    const content = document.getElementById('cart-content');
    
    if (modal.classList.contains('hidden')) {
        modal.classList.remove('hidden');
        // بنشيل الـ translate عشان يرجع مكانه في اليمين
        setTimeout(() => content.classList.remove('translate-x-full'), 10);
    } else {
        // بنرجعه يختفي ناحية اليمين (translate-x-full)
        content.classList.add('translate-x-full');
        setTimeout(() => modal.classList.add('hidden'), 500);
    }
}

    renderProducts('all');
